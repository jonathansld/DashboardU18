<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard U18F</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --card2: #1c2128;
            --border: #30363d;
            --accent: #e94560;
            --blue: #0f3460;
            --gold: #f5a623;
            --txt: #e6edf3;
            --muted: #8b949e;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--txt);
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, var(--card), var(--blue));
            padding: 14px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }
        .htitle h1 { font-size: 1.2rem; font-weight: 700; }
        .htitle p { font-size: 0.72rem; color: var(--muted); }
        .hlogo { font-size: 1.8rem; margin-right: 10px; }
        .hleft { display: flex; align-items: center; }
        .pselector {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .pbtn {
            padding: 5px 13px;
            border: 2px solid var(--border);
            background: transparent;
            color: var(--muted);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.2s;
        }
        .pbtn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        .pbtn:hover:not(.active) {
            border-color: var(--accent);
            color: var(--txt);
        }
        nav {
            background: var(--card);
            padding: 0 22px;
            display: flex;
            gap: 3px;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }
        .nbtn {
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .nbtn:hover { color: var(--txt); }
        .nbtn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .main {
            padding: 22px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .ptitle {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--accent);
        }
        .pfilters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .pfilters input {
            padding: 8px 12px;
            background: var(--card2);
            border: 1px solid var(--border);
            color: var(--txt);
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .pfbtn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .pfbtn:hover { border-color: var(--accent); color: var(--txt); }
        .pfbtn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .pgrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .pcard {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pcard:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(233, 69, 96, 0.2);
        }
        .phead {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .pavatar {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .pname { font-weight: 600; font-size: 0.95rem; }
        .pbadge { font-size: 0.75rem; color: var(--muted); }
        .pminis {
            display: flex;
            gap: 8px;
        }
        .pm {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
        }
        .pm .v { font-weight: 700; font-size: 1.2rem; color: var(--accent); }
        .pm .l { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }
        .twrap {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        thead {
            background: var(--card);
            border-bottom: 2px solid var(--border);
        }
        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: var(--accent);
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }
        tbody tr:hover {
            background: rgba(233, 69, 96, 0.05);
        }
        .vviews {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .vvbtn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .vvbtn.active {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
        }
        .psec {
            margin-bottom: 20px;
        }
        .psec-h {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--gold);
        }
        .sgrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-v { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
        .stat-l { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
        #detailModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            overflow-y: auto;
            display: none;
        }
        #detailModal.show {
            display: block;
        }
        #detailModal > div {
            background: var(--card);
            max-width: 700px;
            margin: 40px auto;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 24px;
        }
        #detailModal h2 { color: var(--accent); margin-bottom: 6px; }
        #detailModal h3 { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
        #detailModal h4 { color: var(--gold); margin-top: 16px; margin-bottom: 8px; font-size: 0.95rem; }
        .detsec table { margin-bottom: 16px; }
        .close-btn { float: right; font-size: 24px; cursor: pointer; color: var(--accent); }
        .close-btn:hover { color: var(--gold); }
    </style>
</head>
<body>

<div class="header">
    <div class="hleft">
        <div class="hlogo">🏉</div>
        <div class="htitle">
            <h1>Dashboard U18F</h1>
            <p>Suivi de performance - Équipe Féminin</p>
        </div>
    </div>
    <div class="pselector">

        <button class="pbtn" onclick="setPeriod('novembre', this)">Novembre</button>
        <button class="pbtn" onclick="setPeriod('janvier', this)">Janvier</button>
        <button class="pbtn" onclick="setPeriod('mai', this)">Mai</button>

</div>

<nav>

    <button class="nbtn" id="nbtn-vit" onclick="showPage('vit', this)">Vitesse</button>

            <button class="pfbtn" onclick="setFilter('vit', 'Demi-Ouverture', this); renderVitesse()">Demi-Ouverture</button>
            <button class="pfbtn" onclick="setFilter('vit', 'Centre', this); renderVitesse()">Centre</button>

let currentPeriod = 'septembre';
let filters = {ov: 'all', vit: 'all', for: 'all', end: 'all', expl: 'all', ant: 'all', j: 'all'};
let views = {vit: 'global', for: 'global', end: 'global', expl: 'global'};

function setPeriod(period, el) {
    currentPeriod = period;
    document.querySelectorAll('.header .pbtn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderCurrentPage();
}

function showPage(page, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nbtn').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    el.classList.add('active');
    setTimeout(() => {
        if (page === 'ov') renderOverview();
        if (page === 'vit') renderVitesse();
        if (page === 'for') renderForce();
        if (page === 'end') renderEndurance();
        if (page === 'expl') renderExplosivite();
        if (page === 'ant') renderAnthropometrie();
        if (page === 'j') renderJoueuses();
        if (page === 'stats') renderStatistiques();
    }, 0);
}

function renderCurrentPage() {
    const active = document.querySelector('.page.active').id.replace('page-', '');
    if (active === 'ov') renderOverview();
    if (active === 'vit') renderVitesse();
    if (active === 'for') renderForce();
    if (active === 'end') renderEndurance();
    if (active === 'expl') renderExplosivite();
    if (active === 'ant') renderAnthropometrie();
    if (active === 'j') renderJoueuses();
    if (active === 'stats') renderStatistiques();
}

function setFilter(section, poste, el) {
    filters[section] = poste;
    el.parentElement.querySelectorAll('.pfbtn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
}

function setView(section, view, el) {
    views[section] = view;
    el.parentElement.querySelectorAll('.vvbtn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    if (section === 'vit') renderVitesse();
    if (section === 'for') renderForce();
    if (section === 'end') renderEndurance();
    if (section === 'expl') renderExplosivite();
}

function getLabel(key) {
    const labels = {
        taille: 'Taille', poids: 'Poids', yoyo: 'YOYO Test',
        dc_1rm: 'Développé couché 1RM', tirage_1rm: 'Tirage 1RM', sdt_1rm: 'Soulevé de terre 1RM', hipthrust: 'Hip Thrust',
        dc_3rm: 'Développé couché 3RM', squat_3rm: 'Squat 3RM', tirage_3rm: 'Tirage 3RM',
        v10: 'V10m', v20: 'V20m', v25: 'V25m', v30: 'V30m', v40: 'V40m', v50: 'V50m',
        ms10: 'MS10m', ms20: 'MS20m', ms25: 'MS25m', ms30: 'MS30m', ms40: 'MS40m', ms50: 'MS50m',
        broad: 'Broad Jump'
    };
    return labels[key] || key;
}

function getFilteredData(section) {
    const search = document.getElementById('search' + (section.charAt(0).toUpperCase() + section.slice(1)))?.value.toLowerCase() || '';
    return DATA.filter(j => {
        const matchesSearch = j.nom.toLowerCase().includes(search);
        const matchesFilter = filters[section] === 'all' || j.poste === filters[section];
        return matchesSearch && matchesFilter;
    });
}

function renderOverview() {
    const filtered = getFilteredData('ov');
    let html = '';
    filtered.forEach(j => {
        const s = j.sessions[currentPeriod];
        if (!s) return;
        const dataCount = Object.values(s).filter(v => v !== null).length;
        const avatar = j.nom.substring(0, 2).toUpperCase();
        html += `<div class="pcard" onclick="showDetail('${j.nom}')">
            <div class="phead">
                <div class="pavatar">${avatar}</div>
                <div>
                    <div class="pname">${j.nom}</div>
                    <div class="pbadge">${j.poste}</div>
                </div>
            </div>
            <div class="pminis">
                <div class="pm"><div class="v">${dataCount}</div><div class="l">Données</div></div>
            </div>
        </div>`;
    });
    document.getElementById('ovGrid').innerHTML = html || '<p style="grid-column: 1/-1; color: var(--muted);">Aucune donnée</p>';
}

function renderVitesse() {
    const filtered = getFilteredData('vit');
    const container = document.getElementById('vitCont');
    container.innerHTML = '';

    if (views.vit === 'global') {
        const speeds = ['v10', 'v20', 'v25', 'v30', 'v40', 'v50'];
        let html = '';
        speeds.forEach(s => {
            const data = [];
            filtered.forEach(j => {
                const val = j.sessions[currentPeriod][s];
                if (val) data.push({nom: j.nom, val: val});
            });
            data.sort((a, b) => a.val - b.val);
            if (data.length > 0) {
                html += `<div class="twrap">
                    <table>
                        <thead><tr><th colspan="2">${getLabel(s)}</th></tr><tr><th>Joueuse</th><th>Temps (s)</th></tr></thead>
                        <tbody>`;
                data.slice(0, 20).forEach(d => {
                    html += `<tr><td>${d.nom}</td><td>${d.val.toFixed(2)}</td></tr>`;
                });
                html += `</tbody></table></div>`;
            }
        });
        container.innerHTML = html || '<p style="color: var(--muted);">Aucune donnée</p>';
    } else {
        const postes = {};
        filtered.forEach(j => {
            if (!postes[j.poste]) postes[j.poste] = [];
            postes[j.poste].push(j);
        });

        let html = '';
        Object.entries(postes).forEach(([poste, joueuses]) => {
            const speeds = ['v10', 'v20', 'v25', 'v30', 'v40', 'v50'];
            html += `<div class="psec"><div class="psec-h">${poste}</div>`;
            speeds.forEach(s => {
                let sum = 0, count = 0;
                joueuses.forEach(j => {
                    const val = j.sessions[currentPeriod][s];
                    if (val) { sum += val; count++; }
                });
                if (count > 0) {
                    html += `<div class="twrap"><table><thead><tr><th colspan="2">${getLabel(s)}</th></tr></thead><tbody><tr><td>Moyenne (n=${count})</td><td>${(sum/count).toFixed(2)}</td></tr></tbody></table></div>`;
                }
            });
            html += `</div>`;
        });
        container.innerHTML = html || '<p style="color: var(--muted);">Aucune donnée</p>';
    }
}

    let html = '';
    stats.forEach(stat => {
        html += `<div class="stat"><div class="stat-v">${stat.value}</div><div class="stat-l">${stat.label}</div></div>`;
    });
    container.innerHTML = html;
}

function showDetail(nom) {
    const j = DATA.find(x => x.nom === nom);
    if (!j) return;
    
    const s = j.sessions[currentPeriod];
    const modal = document.getElementById('detailModal');
    const content = document.getElementById('detailContent');

    let html = `<h2>${j.nom}</h2><h3>${j.poste} - ${currentPeriod.charAt(0).toUpperCase() + currentPeriod.slice(1)}</h3>`;

    const sections = [
        {title: 'Anthropométrie', keys: ['taille', 'poids']},
        {title: 'Puissance aérobie', keys: ['yoyo']},
        {title: 'Force Max (1RM)', keys: ['dc_1rm', 'tirage_1rm', 'sdt_1rm', 'hipthrust']},
        {title: 'Force Max (3RM)', keys: ['dc_3rm', 'squat_3rm', 'tirage_3rm']},
        {title: 'Vitesse', keys: ['v10', 'v20', 'v25', 'v30', 'v40', 'v50', 'ms10', 'ms20', 'ms25', 'ms30', 'ms40', 'ms50']},
        {title: 'Explosivité', keys: ['broad']}
    ];

    sections.forEach(sec => {
        const hasData = sec.keys.some(k => s[k] !== null);
        if (hasData) {
            html += `<h4>${sec.title}</h4><table><tbody>`;
            sec.keys.forEach(k => {
                if (s[k] !== null) {
                    let unit = 's';
                    if (k.includes('ms')) unit = 'm/s';
                    if (k === 'taille') unit = 'cm';
                    if (k === 'poids' || k.includes('rm')) unit = 'kg';
                    if (k === 'yoyo') unit = 'm';
                    if (k === 'broad') unit = 'cm';
                    html += `<tr><td>${getLabel(k)}</td><td><strong>${s[k].toFixed(k === 'taille' ? 0 : 2)}</strong> ${unit}</td></tr>`;
                }
            });
            html += `</tbody></table>`;
        }
    });

    content.innerHTML = html;
    modal.classList.add('show');
}

function closeModal() {
    document.getElementById('detailModal').classList.remove('show');
}

window.onclick = (e) => {
    const modal = document.getElementById('detailModal');
    if (e.target === modal) modal.classList.remove('show');
};

renderOverview();
</script>
</body>
</html>
