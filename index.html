<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#0f0f1a; color:#fff; min-height:100vh; }
.header { background:linear-gradient(135deg,#1a1a2e,#0f3460); padding:25px 40px; border-bottom:2px solid #e94560; display:flex; align-items:center; gap:20px; }
.header h1 { font-size:1.8rem; letter-spacing:2px; }
.header p { color:#a0a0c0; font-size:0.9rem; margin-top:4px; }
.logo { font-size:2.5rem; }
.selectors { background:#1a1a2e; padding:20px 40px; display:flex; gap:20px; flex-wrap:wrap; border-bottom:1px solid #2a2a4e; }
.sel-group { display:flex; flex-direction:column; gap:6px; }
.sel-group label { font-size:0.72rem; text-transform:uppercase; letter-spacing:1.5px; color:#a0a0c0; font-weight:600; }
.sel-group select { background:#0f0f1a; border:1px solid #3a3a6e; color:#fff; padding:10px 15px; border-radius:8px; font-size:0.95rem; min-width:200px; cursor:pointer; }
.welcome { text-align:center; padding:80px 20px; color:#5a5a8e; }
.welcome .icon { font-size:5rem; margin-bottom:20px; }
.dashboard { padding:30px 40px; display:none; }
.player-header { background:linear-gradient(135deg,#1a1a2e,#0f3460); border-radius:12px; padding:20px 30px; display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; border:1px solid #2a2a4e; flex-wrap:wrap; gap:15px; }
.player-name { font-size:2rem; font-weight:700; }
.player-info { color:#a0a0c0; font-size:0.9rem; margin-top:4px; }
.badge { padding:6px 14px; border-radius:20px; font-size:0.8rem; font-weight:600; background:#0f3460; border:1px solid #e94560; color:#e94560; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:15px; margin-bottom:25px; }
.stat-card { background:#1a1a2e; border-radius:10px; padding:15px; border:1px solid #2a2a4e; text-align:center; }
.stat-card .label { font-size:0.72rem; color:#a0a0c0; text-transform:uppercase; margin-bottom:8px; }
.stat-card .value { font-size:1.6rem; font-weight:700; }
.stat-card .unit { font-size:0.75rem; color:#5a5a8e; margin-top:2px; }
.stat-card .evo { font-size:0.85rem; margin-top:5px; font-weight:600; }
.pos { color:#00d4aa; } .neg { color:#e94560; } .neu { color:#a0a0c0; }
.section-title { font-size:1rem; font-weight:700; text-transform:uppercase; letter-spacing:2px; color:#e94560; margin:25px 0 15px; padding-bottom:8px; border-bottom:1px solid #2a2a4e; }
.charts-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); gap:20px; margin-bottom:25px; }
.chart-card { background:#1a1a2e; border-radius:12px; padding:20px; border:1px solid #2a2a4e; }
.chart-card h3 { font-size:0.85rem; color:#a0a0c0; text-transform:uppercase; margin-bottom:15px; }
.table-wrap { overflow-x:auto; background:#1a1a2e; border-radius:12px; padding:15px; }
table { width:100%; border-collapse:collapse; font-size:0.88rem; }
th { background:#0f3460; color:#a0a0c0; text-transform:uppercase; font-size:0.72rem; padding:10px 12px; text-align:left; }
td { padding:10px 12px; border-bottom:1px solid #1a1a3e; }
tr:hover td { background:#1a1a3e; }
</style>
</head>

  "Janvier": {"3RM DC":35,"3RM Squat":85,"3RM Tirage":50,"10m":2.07,"20m":3.62,"30m":5.17,"40m":6.75},
  "Mai": {"1RM DC":55,"1RM Tirage":40}
}},
"Zoé": { poste:"1re Ligne", sessions:{
  "Septembre": {"Poids":63.9,"Yo-yo":920,"1RM DC":17,"1RM Tirage":50,"1RM SDT":40,"1RM HT":100,"10m":2.07,"20m":3.65,"Broad":167},
  "Novembre": {"Poids":63.7,"Yo-yo":920,"1RM DC":55,"1RM Tirage":60,"1RM SDT":100,"1RM HT":125,"10m":1.89,"20m":3.37},
  "Janvier": {"Poids":68.15,"Yo-yo":960,"3RM DC":55,"3RM Squat":110,"3RM Tirage":60,"10m":1.86,"20m":3.26,"30m":4.59,"40m":6.02,"Broad":189}
}}
};

const SESSION_ORDER = ["Septembre","Novembre","Janvier","Mai"];
const METRIC_UNITS = {"Poids":"kg","Yo-yo":"m","1RM DC":"kg","1RM Tirage":"kg","1RM SDT":"kg","1RM HT":"kg","3RM DC":"kg","3RM Squat":"kg","3RM Tirage":"kg","10m":"s","20m":"s","30m":"s","40m":"s","Broad":"cm"};
// Pour ces métriques, baisser = meilleur
const LOWER_IS_BETTER = ["10m","20m","30m","40m"];

let charts = [];

// ============================================================
// 🚀 INIT
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  const sel = document.getElementById('sel-player');
  Object.keys(DATA).sort().forEach(n => {
    const o = document.createElement('option');
    o.value = n; o.textContent = n;
    sel.appendChild(o);
  });
  sel.addEventListener('change', render);
  document.getElementById('sel-session').addEventListener('change', render);
});

// ============================================================
// 📈 RENDER
// ============================================================
function render() {
  const name = document.getElementById('sel-player').value;

  if (!name) {
    document.getElementById('welcome').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
    return;
  }

  document.getElementById('welcome').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  const player = DATA[name];
  document.getElementById('ph-name').textContent = name;
  document.getElementById('ph-info').textContent = `Poste : ${player.poste}`;
  document.getElementById('ph-badges').innerHTML = `<span class="badge">${player.poste}</span>`;

  // ✅ Toutes les sessions où la joueuse a au moins une donnée
  const sessions = SESSION_ORDER.filter(s => player.sessions[s]);

  // ✅ Collecter TOUTES les métriques jamais mesurées
  const allMetrics = new Set();
  sessions.forEach(s => Object.keys(player.sessions[s]).forEach(m => allMetrics.add(m)));
  const metrics = [...allMetrics];

  // ============================================================
  // 📊 STATS CARDS — % évolution PREMIÈRE → DERNIÈRE session
  //     Cellules vides = 0
  // ============================================================
  const statsHTML = metrics.map(m => {
    // ✅ Récupère la valeur de CHAQUE session — vide = 0
    const values = sessions.map(s => {
      const v = player.sessions[s][m];
      return (v === undefined || v === null) ? 0 : v;
    });

    const first = values[0];                   // 1re session
    const last  = values[values.length - 1];   // dernière session (Mai si présente)

    // Calcul du % d'évolution
    let evo = '';
    if (sessions.length > 1) {
      let pct, diff = last - first;

      if (first === 0 && last === 0) {
        evo = `<div class="evo neu">→ 0%</div>`;
      } else if (first === 0) {
        // De 0 à une valeur = nouvelle perf
        const better = !LOWER_IS_BETTER.includes(m);
        evo = `<div class="evo ${better ? 'pos' : 'neg'}">▲ NEW</div>`;
      } else {
        pct = (diff / first * 100).toFixed(1);
        const better = LOWER_IS_BETTER.includes(m) ? diff < 0 : diff > 0;
        const cls = diff === 0 ? 'neu' : (better ? 'pos' : 'neg');
        const arrow = diff === 0 ? '→' : (diff > 0 ? '▲' : '▼');
        evo = `<div class="evo ${cls}">${arrow} ${pct}%</div>`;
      }
    }

    return `<div class="stat-card">
      <div class="label">${m}</div>
      <div class="value">${last}</div>
      <div class="unit">${METRIC_UNITS[m] || ''}</div>
      ${evo}
    </div>`;
  }).join('');
  document.getElementById('stats-grid').innerHTML = statsHTML || '<p style="color:#a0a0c0">Aucune donnée</p>';

  // ============================================================
  // 📈 GRAPHIQUES — cellules vides = 0
  // ============================================================
  charts.forEach(c => c.destroy());
  charts = [];
  const chartsContainer = document.getElementById('charts-grid');
  chartsContainer.innerHTML = '';

  metrics.forEach(m => {
    // ✅ Cellules vides = 0
    const values = sessions.map(s => {
      const v = player.sessions[s][m];
      return (v === undefined || v === null) ? 0 : v;
    });

    // Pas de graphique si une seule session
    if (sessions.length < 2) return;

    const card = document.createElement('div');
    card.className = 'chart-card';
    card.innerHTML = `<h3>${m} (${METRIC_UNITS[m] || ''})</h3><canvas></canvas>`;
    chartsContainer.appendChild(card);

    // Graduations + décimales pour les sprints
    const isSprint = ["10m","20m","25m","30m","40m","50m"].includes(m);

    const ctx = card.querySelector('canvas').getContext('2d');
    charts.push(new Chart(ctx, {
      type: 'line',
      data: {
        labels: sessions,
        datasets: [{
          label: m,
          data: values,
          borderColor: '#e94560',
          backgroundColor: 'rgba(233,69,96,0.2)',
          borderWidth: 3,
          tension: 0.3,
          pointRadius: 6,
          pointBackgroundColor: '#fff',
          fill: true
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: '#a0a0c0' } },
          tooltip: {
            callbacks: {
              label: ctx => `${ctx.parsed.y} ${METRIC_UNITS[m] || ''}`
            }
          }
        },
        scales: {
          x: { ticks: { color: '#a0a0c0' }, grid: { color: '#2a2a4e' } },
          y: {
            ticks: {
              color: '#a0a0c0',
              callback: v => isSprint ? v.toFixed(2) : v
            },
            grid: { color: '#2a2a4e' }
          }
        }
      }
    }));
  });

  // ============================================================
  // 📋 TABLEAU — cellules vides affichées comme 0
  // ============================================================
  let tableHTML = '<table><thead><tr><th>Métrique</th>';
  sessions.forEach(s => tableHTML += `<th>${s}</th>`);
  tableHTML += '<th>Évolution</th></tr></thead><tbody>';

  metrics.forEach(m => {
    tableHTML += `<tr><td><strong>${m}</strong></td>`;
    const values = sessions.map(s => {
      const v = player.sessions[s][m];
      return (v === undefined || v === null) ? 0 : v;
    });
    values.forEach(v => tableHTML += `<td>${v}</td>`);

    // Évolution dans le tableau
    const first = values[0], last = values[values.length - 1];
    let evoCell = '—';
    if (sessions.length > 1 && first !== 0) {
      const diff = last - first;
      const pct = (diff / first * 100).toFixed(1);
      const better = LOWER_IS_BETTER.includes(m) ? diff < 0 : diff > 0;
      const cls = diff === 0 ? 'neu' : (better ? 'pos' : 'neg');
      const arrow = diff === 0 ? '→' : (diff > 0 ? '▲' : '▼');
      evoCell = `<span class="${cls}">${arrow} ${pct}%</span>`;
    }
    tableHTML += `<td>${evoCell}</td></tr>`;
  });

  tableHTML += '</tbody></table>';
  document.getElementById('history-table').innerHTML = tableHTML;
}

</script>
