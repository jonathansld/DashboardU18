<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tests Physiques - U18F</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; }

        .header {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            padding: 25px 40px;
            border-bottom: 2px solid #e94560;
            display: flex; align-items: center; gap: 20px;
        }
        .header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: 2px; }
        .header p { color: #a0a0c0; font-size: 0.9rem; margin-top: 4px; }
        .logo { font-size: 2.5rem; }

        .selectors {
            background: #1a1a2e;
            padding: 20px 40px;
            display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap;
            border-bottom: 1px solid #2a2a4e;
        }
        .sel-group { display: flex; flex-direction: column; gap: 6px; }
        .sel-group label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.5px; color: #a0a0c0; font-weight: 600; }
        .sel-group select {
            background: #0f0f1a; border: 1px solid #3a3a6e; color: #fff;
            padding: 10px 15px; border-radius: 8px; font-size: 0.95rem;
            cursor: pointer; min-width: 180px;
        }
        .sel-group select:focus { outline: none; border-color: #e94560; }

        .welcome {
            text-align: center; padding: 80px 20px; color: #3a3a6e;
        }
        .welcome .icon { font-size: 5rem; margin-bottom: 20px; }
        .welcome h2 { font-size: 1.5rem; color: #5a5a8e; }

        .dashboard { padding: 30px 40px; display: none; }

        .player-header {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            border-radius: 12px; padding: 20px 30px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border: 1px solid #2a2a4e;
            flex-wrap: wrap; gap: 15px;
        }
        .player-name { font-size: 2rem; font-weight: 700; }
        .player-info { color: #a0a0c0; font-size: 0.9rem; margin-top: 4px; }
        .player-badges { display: flex; gap: 10px; flex-wrap: wrap; }
        .badge {
            padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
            background: #0f3460; border: 1px solid #e94560; color: #e94560;
        }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px; margin-bottom: 25px;
        }
        .stat-card {
            background: #1a1a2e; border-radius: 10px; padding: 15px;
            border: 1px solid #2a2a4e; text-align: center;
        }
        .stat-card .label { font-size: 0.72rem; color: #a0a0c0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .stat-card .value { font-size: 1.6rem; font-weight: 700; color: #fff; }
        .stat-card .unit { font-size: 0.75rem; color: #5a5a8e; margin-top: 2px; }
        .stat-card .evo { font-size: 0.8rem; margin-top: 5px; }

        .pill-pos { color: #00d4aa; }
        .pill-neg { color: #e94560; }
        .pill-neu { color: #a0a0c0; }

        .section-title {
            font-size: 1rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; color: #e94560; margin: 25px 0 15px;
            padding-bottom: 8px; border-bottom: 1px solid #2a2a4e;
        }

        .charts-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px; margin-bottom: 25px;
        }
        .chart-card {
            background: #1a1a2e; border-radius: 12px; padding: 20px;
            border: 1px solid #2a2a4e;
        }
        .chart-card h3 { font-size: 0.85rem; color: #a0a0c0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }

        .table-wrap { overflow-x: auto; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        th {
            background: #0f3460; color: #a0a0c0; text-transform: uppercase;
            font-size: 0.72rem; letter-spacing: 1px; padding: 10px 12px; text-align: left;
        }
        td { padding: 10px 12px; border-bottom: 1px solid #1a1a3e; }
        tr:hover td { background: #1a1a3e; }
        .td-name { font-weight: 600; color: #fff; }

        @media (max-width: 600px) {
            .header, .selectors, .dashboard { padding: 15px; }
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

const SESSIONS_ORDER = ["Septembre", "Novembre", "Janvier", "Mai"];

const METRICS = [
    { key: "poids",      label: "Poids",        unit: "kg",  lower_is_better: true,  icon: "⚖️" },
    { key: "yoyo",       label: "Yo-Yo L1",     unit: "m",   lower_is_better: false, icon: "🫁" },
    { key: "sprint10",   label: "10m",          unit: "s",   lower_is_better: true,  icon: "⚡" },
    { key: "sprint20",   label: "20m",          unit: "s",   lower_is_better: true,  icon: "⚡" },
    { key: "sprint25",   label: "25m",          unit: "s",   lower_is_better: true,  icon: "⚡" },
    { key: "sprint50",   label: "50m",          unit: "s",   lower_is_better: true,  icon: "⚡" },
    { key: "dc_1rm",     label: "DC 1RM",       unit: "kg",  lower_is_better: false, icon: "🏋️" },
    { key: "tirage_1rm", label: "Tirage 1RM",   unit: "kg",  lower_is_better: false, icon: "🏋️" },
    { key: "sdt_1rm",    label: "SDT 1RM",      unit: "kg",  lower_is_better: false, icon: "🏋️" },
    { key: "hip_1rm",    label: "Hip Thrust 1RM",unit:"kg",  lower_is_better: false, icon: "🏋️" },
    { key: "dc_3rm",     label: "DC 3RM",       unit: "kg",  lower_is_better: false, icon: "🏋️" },
    { key: "squat_3rm",  label: "Squat 3RM",    unit: "kg",  lower_is_better: false, icon: "🏋️" },
    { key: "tirage_3rm", label: "Tirage 3RM",   unit: "kg",  lower_is_better: false, icon: "🏋️" },
    { key: "broadjump",  label: "Broad Jump",   unit: "cm",  lower_is_better: false, icon: "🦘" },
    { key: "flexion",    label: "Flexion ISO",  unit: "N·m", lower_is_better: false, icon: "💪" },
    { key: "extension",  label: "Extension ISO",unit: "N·m", lower_is_better: false, icon: "💪" },
];

const chartInstances = {};

// Init selector
const selPlayer = document.getElementById('sel-player');
Object.keys(DATA.players).sort().forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    selPlayer.appendChild(opt);
});

function getVal(v) { return (v === undefined || v === null) ? 0 : v; }

function evo(val, prev, lower_is_better) {
    if (!prev || !val) return null;
    const diff = val - prev;
    const pct = ((diff / prev) * 100).toFixed(1);
    const positive = lower_is_better ? diff < 0 : diff > 0;
    const cls = diff === 0 ? 'pill-neu' : positive ? 'pill-pos' : 'pill-neg';
    const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '—';
    return `<span class="${cls}">${arrow} ${diff > 0 ? '+' : ''}${pct}%</span>`;
}

function render() {
    const playerName = selPlayer.value;
    const sessionFilter = document.getElementById('sel-session').value;
    if (!playerName) {
        document.getElementById('welcome').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        return;
    }
    document.getElementById('welcome').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';

    const player = DATA.players[playerName];
    const allSessions = SESSIONS_ORDER.filter(s => player.sessions[s]);
    const sessions = sessionFilter === 'all' ? allSessions : allSessions.filter(s => s === sessionFilter);

    // Header
    document.getElementById('ph-name').textContent = playerName;
    document.getElementById('ph-info').textContent = `${player.poste} — ${allSessions.join(', ')}`;
    const badges = document.getElementById('ph-badges');
    badges.innerHTML = sessions.map(s => `<span class="badge">📅 ${s}</span>`).join('');

    // Stats grid — dernière session disponible
    const lastSession = sessions[sessions.length - 1];
    const prevSession = sessions.length > 1 ? sessions[sessions.length - 2] : null;
    const statsGrid = document.getElementById('stats-grid');
    statsGrid.innerHTML = '';
    METRICS.forEach(m => {
        const val = lastSession ? getVal(player.sessions[lastSession]?.[m.key]) : 0;
        if (val === 0 && !player.sessions[lastSession]?.[m.key]) return;
        const prevVal = prevSession ? getVal(player.sessions[prevSession]?.[m.key]) : null;
        const evoHtml = prevVal ? evo(val, prevVal, m.lower_is_better) : '';
        statsGrid.innerHTML += `
            <div class="stat-card">
                <div class="label">${m.icon} ${m.label}</div>
                <div class="value">${val || '—'}</div>
                <div class="unit">${m.unit}</div>
                <div class="evo">${evoHtml}</div>
            </div>`;
    });

    // Charts
    const chartsGrid = document.getElementById('charts-grid');
    chartsGrid.innerHTML = '';
    Object.values(chartInstances).forEach(c => c.destroy());

    const chartMetrics = [
        { keys: ['sprint10','sprint20','sprint25','sprint50'], label: 'Vitesse — Sprints (s)', lower_is_better: true },
        { keys: ['dc_1rm','tirage_1rm','sdt_1rm','hip_1rm'], label: 'Force — 1RM (kg)', lower_is_better: false },
        { keys: ['dc_3rm','squat_3rm','tirage_3rm'], label: 'Force — 3RM (kg)', lower_is_better: false },
        { keys: ['yoyo'], label: 'Endurance — Yo-Yo (m)', lower_is_better: false },
        { keys: ['broadjump'], label: 'Détente — Broad Jump (cm)', lower_is_better: false },
        { keys: ['flexion','extension'], label: 'Isocinétisme (N·m)', lower_is_better: false },
    ];

    const colors = ['#e94560','#00d4aa','#f5a623','#7c4dff','#00b0ff','#69f0ae'];

    chartMetrics.forEach((cm, ci) => {
        // Ne créer le graphique que si des données existent
        let hasData = false;
        cm.keys.forEach(k => {
            sessions.forEach(s => {
                if (player.sessions[s]?.[k]) hasData = true;
            });
        });
        if (!hasData) return;

        const canvasId = `chart-${ci}`;
        chartsGrid.innerHTML += `<div class="chart-card"><h3>${cm.label}</h3><canvas id="${canvasId}"></canvas></div>`;

        setTimeout(() => {
            const ctx = document.getElementById(canvasId)?.getContext('2d');
            if (!ctx) return;
            const datasets = cm.keys.map((k, ki) => {
                const m = METRICS.find(x => x.key === k);
                return {
                    label: m ? m.label : k,
                    data: sessions.map(s => player.sessions[s]?.[k] || null),
                    borderColor: colors[ki % colors.length],
                    backgroundColor: colors[ki % colors.length] + '22',
                    borderWidth: 2.5,
                    pointRadius: 5,
                    pointHoverRadius: 7,
                    tension: 0.3,
                    spanGaps: true,
                };
            });
            chartInstances[canvasId] = new Chart(ctx, {
                type: 'line',
                data: { labels: sessions, datasets },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { labels: { color: '#a0a0c0', font: { size: 11 } } },
                        tooltip: {
                            callbacks: {
                                afterLabel: (item) => {
                                    const k = cm.keys[item.datasetIndex];
                                    const m = METRICS.find(x => x.key === k);
                                    const si = sessions.indexOf(item.label);
                                    if (si === 0) return '';
                                    const cur = item.raw;
                                    const prev = player.sessions[sessions[si-1]]?.[k];
                                    if (!cur || !prev) return '';
                                    const diff = cur - prev;
                                    const pct = ((diff / prev) * 100).toFixed(1);
                                    const positive = m?.lower_is_better ? diff < 0 : diff > 0;
                                    return `${positive ? '✅' : '❌'} ${diff > 0 ? '+' : ''}${pct}%`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { ticks: { color: '#a0a0c0' }, grid: { color: '#2a2a4e' } },
                        y: { ticks: { color: '#a0a0c0' }, grid: { color: '#2a2a4e' } }
                    }
                }
            });
        }, 50);
    });

    // Tableau historique
    const tableWrap = document.getElementById('history-table');
    const metricsWithData = METRICS.filter(m => sessions.some(s => player.sessions[s]?.[m.key]));
    let html = `<table><thead><tr><th>Métrique</th>${sessions.map(s=>`<th>${s}</th>`).join('')}<th>Évolution</th></tr></thead><tbody>`;

    metricsWithData.forEach(m => {
        const vals = sessions.map(s => player.sessions[s]?.[m.key]);
        if (vals.every(v => !v)) return;
        const first = vals.find(v => v > 0);
        const last = [...vals].reverse().find(v => v > 0);
        const evoGlobal = (first && last && first !== last) ? evo(last, first, m.lower_is_better) : '<span class="pill-neu">—</span>';

        const cells = vals.map((val, i) => {
            if (!val) return `<td style="color:#3a3a5e">—</td>`;
            const prev = i > 0 ? vals.slice(0, i).reverse().find(v => v > 0) : null;
            const badge = prev ? ` ${evo(val, prev, m.lower_is_better)}` : '';
            return `<td>${val} ${m.unit}${badge}</td>`;
        });

        html += `<tr><td class="td-name">${m.icon} ${m.label}</td>${cells.join('')}<td>${evoGlobal}</td></tr>`;
    });

    html += `</tbody></table>`;
    tableWrap.innerHTML = html;
}
</script>
