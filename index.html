<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datas U18F 2025-2026 - MHR Cadettes</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo">🏉</div>
    <div class="header-title">
      <h1>Datas U18F 2025-2026</h1>
      <p>MHR Cadettes — Suivi des performances physiques</p>
    </div>
  </div>
  <div class="header-right">
    <a href="admin.html">🔑 Admin</a>
  </div>
</div>

<div class="container">

  <!-- CONTROLS -->
  <div class="controls">
    <div>
      <label>Joueuse</label>
      <select id="selJ" onchange="render()"></select>
    </div>
    <div>
      <label>Périodes à comparer</label>
      <div class="periods" id="periods"></div>
    </div>
  </div>

  <!-- PLAYER INFO -->
  <div class="player-info" id="playerInfo"></div>

  <!-- STATS GRID -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- CHARTS -->
  <div class="section">
    <h3>📈 Évolution Vitesse (temps en secondes - plus bas = mieux)</h3>
    <div class="chart-container"><canvas id="chartVitesse"></canvas></div>
  </div>

  <div class="section">
    <h3>💪 Évolution Force (kg)</h3>
    <div class="chart-container"><canvas id="chartForce"></canvas></div>
  </div>

  <div class="section">
    <h3>🫀 Évolution Endurance (Yo-Yo distance en mètres)</h3>
    <div class="chart-container"><canvas id="chartEndurance"></canvas></div>
  </div>

  <!-- TABLE -->
  <div class="section">
    <h3>📋 Tableau complet d'évolution</h3>
    <div style="overflow-x:auto;">
      <table id="evoTable"></table>
    </div>
  </div>

</div>

<script src="data.js"></script>
<script>
// ============ ÉTAT ============
let selectedPeriods = [...PERIODS];
let charts = {};

// ============ INIT ============
function init() {
  // Remplir le select joueuses
  const sel = document.getElementById('selJ');
  Object.keys(DATA).sort().forEach(nom => {
    const opt = document.createElement('option');
    opt.value = nom;
    opt.textContent = nom;
    sel.appendChild(opt);
  });

  // Créer les checkboxes périodes
  const per = document.getElementById('periods');
  PERIODS.forEach(p => {
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="checkbox" value="${p}" checked onchange="togglePeriod('${p}')"> ${p}`;
    per.appendChild(lbl);
  });

  render();
}

function togglePeriod(p) {
  if (selectedPeriods.includes(p)) {
    selectedPeriods = selectedPeriods.filter(x => x !== p);
  } else {
    selectedPeriods.push(p);
    selectedPeriods.sort((a,b) => PERIODS.indexOf(a) - PERIODS.indexOf(b));
  }
  render();
}

// ============ RENDER ============
function render() {
  const nom = document.getElementById('selJ').value;
  const joueuse = DATA[nom];
  if (!joueuse) return;

  renderPlayerInfo(nom, joueuse);
  renderStats(joueuse);
  renderCharts(joueuse);
  renderTable(joueuse);
}

// ============ INFO JOUEUSE ============
function renderPlayerInfo(nom, j) {
  const div = document.getElementById('playerInfo');
  const periodes = Object.keys(j.stats).filter(p => selectedPeriods.includes(p));
  div.innerHTML = `
    <h2>${nom}</h2>
    <p>Poste : <strong>${j.poste || 'Non renseigné'}</strong></p>
    <div>${periodes.map(p => `<span class="tag">${p}</span>`).join('')}</div>
  `;
}

// ============ STATS CARDS ============
function renderStats(j) {
  const grid = document.getElementById('statsGrid');
  const periodes = selectedPeriods.filter(p => j.stats[p]);
  if (periodes.length === 0) {
    grid.innerHTML = '<p style="color:var(--text-muted)">Aucune donnée pour les périodes sélectionnées</p>';
    return;
  }

  const first = j.stats[periodes[0]];
  const last = j.stats[periodes[periodes.length - 1]];

  const indicateurs = [
    {key:'poids', label:'Poids', unit:'kg', betterLow:false},
    {key:'yoyo', label:'Yo-Yo', unit:'m', betterLow:false},
    {key:'palier', label:'Palier Yo-Yo', unit:'', betterLow:false},
    {key:'dc_1rm', label:'Développé Couché', unit:'kg', betterLow:false, alt:'dc'},
    {key:'tirage_1rm', label:'Tirage', unit:'kg', betterLow:false, alt:'tirage'},
    {key:'squat_1rm', label:'Squat', unit:'kg', betterLow:false},
    {key:'broad', label:'Broad Jump', unit:'cm', betterLow:false},
    {key:'v10', label:'10m', unit:'s', betterLow:true},
    {key:'v20', label:'20m', unit:'s', betterLow:true},
    {key:'v30', label:'30m', unit:'s', betterLow:true},
    {key:'v40', label:'40m', unit:'s', betterLow:true}
  ];

  let html = '';
  indicateurs.forEach(ind => {
    const v1 = first[ind.key] ?? (ind.alt ? first[ind.alt] : null);
    const v2 = last[ind.key] ?? (ind.alt ? last[ind.alt] : null);
    if (v2 == null) return;

    let evo = '';
    if (v1 != null && v2 != null && periodes.length > 1) {
      const diff = v2 - v1;
      const pct = ((diff / v1) * 100).toFixed(1);
      const isImproved = ind.betterLow ? diff < 0 : diff > 0;
      const cls = diff === 0 ? 'evo-neutral' : (isImproved ? 'evo-up' : 'evo-down');
      const arrow = diff === 0 ? '→' : (isImproved ? '▲' : '▼');
      evo = `<div class="stat-evolution ${cls}">${arrow} ${diff > 0 ? '+' : ''}${diff.toFixed(2)} (${pct}%)</div>`;
    }

    html += `
      <div class="stat-card">
        <div class="stat-label">${ind.label}</div>
        <div class="stat-value">${v2}<span class="stat-unit">${ind.unit}</span></div>
        ${evo}
      </div>
    `;
  });

  grid.innerHTML = html || '<p style="color:var(--text-muted)">Aucune donnée disponible</p>';
}

// ============ CHARTS ============
function renderCharts(j) {
  const periodes = selectedPeriods.filter(p => j.stats[p]);

  // Vitesse
  makeChart('chartVitesse', periodes, [
    {label:'10m', key:'v10', color:'#f59e0b'},
    {label:'20m', key:'v20', color:'#3b82f6'},
    {label:'30m', key:'v30', color:'#10b981'},
    {label:'40m', key:'v40', color:'#ef4444'},
    {label:'50m', key:'v50', color:'#a855f7'}
  ], j);

  // Force
  makeChart('chartForce', periodes, [
    {label:'Développé Couché', key:'dc_1rm', alt:'dc', color:'#f59e0b'},
    {label:'Tirage', key:'tirage_1rm', alt:'tirage', color:'#3b82f6'},
    {label:'Squat', key:'squat_1rm', color:'#10b981'},
    {label:'SDT', key:'sdt_1rm', color:'#ef4444'},
    {label:'Hip Thrust', key:'hipthrust', color:'#a855f7'}
  ], j);

  // Endurance
  makeChart('chartEndurance', periodes, [
    {label:'Yo-Yo (m)', key:'yoyo', color:'#f59e0b'}
  ], j);
}

function makeChart(canvasId, periodes, series, j) {
  if (charts[canvasId]) charts[canvasId].destroy();

  const datasets = series.map(s => ({
    label: s.label,
    data: periodes.map(p => {
      const v = j.stats[p][s.key];
      return v != null ? v : (s.alt ? j.stats[p][s.alt] : null);
    }),
    borderColor: s.color,
    backgroundColor: s.color + '33',
    borderWidth: 3,
    tension: 0.3,
    spanGaps: true,
    pointRadius: 5,
    pointHoverRadius: 7
  }));

  charts[canvasId] = new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: { labels: periodes, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#e8eaed' } }
      },
      scales: {
        x: { ticks: { color: '#9ca3af' }, grid: { color: '#2d3548' } },
        y: { ticks: { color: '#9ca3af' }, grid: { color: '#2d3548' } }
      }
    }
  });
}

// ============ TABLE ============
function renderTable(j) {
  const periodes = selectedPeriods.filter(p => j.stats[p]);
  const indicateurs = [
    ['Poids (kg)', 'poids'],
    ['Taille (cm)', 'taille'],
    ['Yo-Yo (m)', 'yoyo'],
    ['Palier Yo-Yo', 'palier'],
    ['Flexion', 'flex'],
    ['Extension', 'ext'],
    ['DC 1RM (kg)', 'dc_1rm', 'dc'],
    ['Tirage 1RM (kg)', 'tirage_1rm', 'tirage'],
    ['Squat 1RM (kg)', 'squat_1rm'],
    ['SDT 1RM (kg)', 'sdt_1rm'],
    ['Hip Thrust (kg)', 'hipthrust'],
    ['Broad Jump (cm)', 'broad'],
    ['10m (s)', 'v10'],
    ['20m (s)', 'v20'],
    ['25m (s)', 'v25'],
    ['30m (s)', 'v30'],
    ['40m (s)', 'v40'],
    ['50m (s)', 'v50']
  ];

  let html = '<thead><tr><th>Indicateur</th>';
  periodes.forEach(p => html += `<th>${p}</th>`);
  html += '</tr></thead><tbody>';

  indicateurs.forEach(ind => {
    const [label, key, alt] = ind;
    const values = periodes.map(p => j.stats[p][key] ?? (alt ? j.stats[p][alt] : null));
    if (values.every(v => v == null)) return;

    html += `<tr><td><strong>${label}</strong></td>`;
    values.forEach(v => html += `<td>${v ?? '—'}</td>`);
    html += '</tr>';
  });

  html += '</tbody>';
  document.getElementById('evoTable').innerHTML = html;
}

// ============ START ============
init();
</script>

</body>
</html>
