<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Dashboard U18F 25/26</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1f2630;--border:#30363d;--accent:#e94560;--accent2:#f5a623;--ok:#2ea043;--ko:#da3633;--muted:#8b949e;--text:#e6edf3}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:16px;min-height:100vh}
.header{background:linear-gradient(135deg,#e94560,#c13651);padding:18px;border-radius:12px;margin-bottom:16px;text-align:center}
.header h1{font-size:1.4rem}
.controls{background:var(--card);padding:14px;border-radius:10px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.controls label{font-weight:600;color:var(--muted);font-size:.85rem}
select{background:var(--card2);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:.9rem;min-width:200px}
.pchk{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:2px solid var(--border);border-radius:16px;cursor:pointer;font-size:.82rem;color:var(--muted);transition:all .2s;user-select:none}
.pchk.active{border-color:var(--accent);color:var(--accent);background:rgba(233,69,96,.08)}
.pchk input{display:none}
.periods{display:flex;gap:8px;flex-wrap:wrap}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:5px}
.cat{background:var(--card2);border:2px solid var(--border);border-radius:10px;padding:18px 14px;cursor:pointer;text-align:center;transition:all .2s}
.cat:hover{border-color:var(--accent);transform:translateY(-2px)}
.cat .ico{font-size:1.8rem;margin-bottom:6px}
.cat .name{font-weight:600;font-size:.9rem}
.cat .desc{color:var(--muted);font-size:.75rem;margin-top:3px}
.section{background:var(--card);border-radius:12px;padding:20px;margin-bottom:16px}
.section h2{margin-bottom:14px;font-size:1.05rem}
.section h3{margin:18px 0 10px;color:var(--accent2);font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card2);padding:14px;border-radius:8px;border-left:3px solid var(--accent)}
.stat .label{font-size:.75rem;color:var(--muted);margin-bottom:4px}
.stat .val{font-size:1.3rem;font-weight:700;color:var(--accent)}
.stat .unit{font-size:.75rem;color:var(--muted);margin-left:3px}
.evo{font-size:.75rem;margin-top:4px;font-weight:600}
.evo.pos{color:var(--ok)}
.evo.neg{color:var(--ko)}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.85rem}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--border)}
th{background:var(--card2);color:var(--accent2);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.5px}
td:first-child,th:first-child{text-align:left}
tr:hover td{background:rgba(255,255,255,.02)}
.pos{color:var(--ok);font-weight:600}
.neg{color:var(--ko);font-weight:600}
.chart-wrap{background:var(--card2);border-radius:8px;padding:12px;margin-top:10px;height:300px;position:relative}
.back{background:var(--card2);color:var(--text);border:1px solid var(--border);padding:8px 16px;border-radius:6px;cursor:pointer;margin-bottom:12px;font-size:.85rem}
.back:hover{border-color:var(--accent);color:var(--accent)}
.subtitle{color:var(--muted);font-size:.8rem;margin-top:4px}
.tbl-wrap{overflow-x:auto;margin-top:8px}
</style>
</head>

  Janvier:{taille:163,poids:68.15,palier:15.5,yoyo:960,dc_3rm:55,squat_3rm:110,tirage_3rm:60,v10:1.86,v20:3.26,v30:4.59,v40:6.02,broad:189},
  Mai:{dc_3rm:62.5,tirage_3rm:60,v10:1.86,v20:3.26,v30:4.59,v40:6.02,broad:189}

};

// distances pour calcul m/s par sprint
const DIST = {v10:10,v20:20,v25:25,v30:30,v40:40,v50:50};

let selectedPeriods = [...PERIODS];
let selectedCat = null;
let charts = [];
</script>
<script>
// ====== INIT ======
function initUI(){
  const sel = document.getElementById('selJ');
  Object.keys(DATA).sort().forEach(n=>{
    const o=document.createElement('option');o.value=n;o.textContent=n+' ('+DATA[n].poste+')';sel.appendChild(o);
  });
  const pc = document.getElementById('periods');
  PERIODS.forEach(p=>{
    const lbl=document.createElement('label');
    lbl.className='pchk active';
    lbl.innerHTML=`<input type="checkbox" checked value="${p}">${p}`;
    lbl.querySelector('input').addEventListener('change',e=>{
      if(e.target.checked){selectedPeriods.push(p);lbl.classList.add('active');}
      else{selectedPeriods=selectedPeriods.filter(x=>x!==p);lbl.classList.remove('active');}
      selectedPeriods.sort((a,b)=>PERIODS.indexOf(a)-PERIODS.indexOf(b));
      render();
    });
    pc.appendChild(lbl);
  });
}

function getVal(j,p,k){
  const s = DATA[j].stats[p];
  return s && s[k]!=null ? s[k] : null;
}

function fmt(v,k){
  if(v==null) return '—';
  const u = UNITS[k]||'';
  return (typeof v==='number'?(+v.toFixed(2)):v)+(u?' '+u:'');
}

function evolBadge(first,last,key){
  if(first==null||last==null) return '<span class="muted">—</span>';
  const d = last-first;
  if(Math.abs(d)<0.001) return '<span>=</span>';
  const better = INVERT.includes(key) ? d<0 : d>0;
  const sign = d>0?'+':'';
  return `<span class="${better?'pos':'neg'}">${sign}${d.toFixed(2)} ${UNITS[key]||''}</span>`;
}

function destroyCharts(){charts.forEach(c=>c.destroy());charts=[];}

// ====== RENDU PRINCIPAL ======
function render(){
  destroyCharts();
  const j = document.getElementById('selJ').value;
  const content = document.getElementById('content');
  if(selectedCat){renderCat(j); return;}

  // Vue d'ensemble : cartes catégories + évolution globale par unité
  let html = `<div class="section"><h2>👤 ${j} — ${DATA[j].poste}</h2>
    <div class="cats">`;
  Object.entries(CATS).forEach(([k,c])=>{
    html += `<div class="cat" onclick="openCat('${k}')">
      <div class="ico">${c.ico}</div>
      <div class="name">${c.name}</div>
      <div class="desc">${c.desc}</div></div>`;
  });
  html += `</div></div>`;

  // Évolution globale — regroupée par unité
  html += `<div class="section"><h2>📊 Évolution globale</h2>`;
  
  // Récupérer toutes les clés présentes pour cette joueuse
  const allKeys = new Set();
  selectedPeriods.forEach(p=>{
    const s = DATA[j].stats[p];
    if(s) Object.keys(s).forEach(k=>{if(LABELS[k]) allKeys.add(k);});
  });

  // Grouper par unité
  const byUnit = {};
  allKeys.forEach(k=>{
    const u = UNITS[k]||'autre';
    if(!byUnit[u]) byUnit[u]=[];
    byUnit[u].push(k);
  });

  const unitOrder = ['kg','cm','m','s',''];
  const unitNames = {kg:'Charges (kg)', cm:'Distances (cm)', m:'Distance (m)', s:'Temps (s)', '':'Palier'};

  unitOrder.forEach(u=>{
    if(!byUnit[u]||byUnit[u].length===0) return;
    const keys = byUnit[u].sort((a,b)=>Object.keys(LABELS).indexOf(a)-Object.keys(LABELS).indexOf(b));
    html += `<h3>${unitNames[u]||u}</h3><div class="tbl-wrap"><table>
      <thead><tr><th>Indicateur</th>`;
    selectedPeriods.forEach(p=>html+=`<th>${p}</th>`);
    html += `<th>Évolution</th></tr></thead><tbody>`;
    keys.forEach(k=>{
      html += `<tr><td><strong>${LABELS[k]}</strong></td>`;
      const vals = selectedPeriods.map(p=>getVal(j,p,k));
      vals.forEach(v=>html+=`<td>${fmt(v,k)}</td>`);
      const firstV = vals.find(v=>v!=null);
      const lastV = [...vals].reverse().find(v=>v!=null);
      html += `<td>${vals.filter(v=>v!=null).length>=2 ? evolBadge(firstV,lastV,k) : '—'}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  });

  if(allKeys.size===0) html += `<p class="subtitle">Aucune donnée pour les périodes sélectionnées.</p>`;
  html += `</div>`;

  content.innerHTML = html;
}

// ====== VUE CATÉGORIE ======
function renderCat(j){
  destroyCharts();
  const cat = CATS[selectedCat];
  const content = document.getElementById('content');
  let html = `<button class="back" onclick="closeCat()">← Retour</button>
    <div class="section"><h2>${cat.ico} ${cat.name} — ${j}</h2>`;

  // Tableau principal
  html += `<div class="tbl-wrap"><table><thead><tr><th>Indicateur</th>`;
  selectedPeriods.forEach(p=>html+=`<th>${p}</th>`);
  html += `<th>Évolution</th></tr></thead><tbody>`;
  
  const presentKeys = cat.keys.filter(k=>{
    return selectedPeriods.some(p=>getVal(j,p,k)!=null);
  });

  presentKeys.forEach(k=>{
    html += `<tr><td><strong>${LABELS[k]}</strong></td>`;
    const vals = selectedPeriods.map(p=>getVal(j,p,k));
    vals.forEach(v=>html+=`<td>${fmt(v,k)}</td>`);
    const firstV = vals.find(v=>v!=null);
    const lastV = [...vals].reverse().find(v=>v!=null);
    html += `<td>${vals.filter(v=>v!=null).length>=2 ? evolBadge(firstV,lastV,k) : '—'}</td></tr>`;
  });
  html += `</tbody></table></div>`;

  // === Spécial VITESSE : tableau m/s et km/h ===
  if(selectedCat==='vitesse' && presentKeys.length>0){
    html += `<h3>🚀 Vitesse moyenne (m/s)</h3><div class="tbl-wrap"><table><thead><tr><th>Sprint</th>`;
    selectedPeriods.forEach(p=>html+=`<th>${p}</th>`);
    html += `<th>Évolution</th></tr></thead><tbody>`;
    presentKeys.forEach(k=>{
      const dist = DIST[k];
      html += `<tr><td><strong>${LABELS[k]}</strong></td>`;
      const ms = selectedPeriods.map(p=>{
        const t = getVal(j,p,k);
        return t!=null && t>0 ? dist/t : null;
      });
      ms.forEach(v=>html+=`<td>${v!=null?v.toFixed(2)+' m/s':'—'}</td>`);
      const f = ms.find(v=>v!=null), l = [...ms].reverse().find(v=>v!=null);
      if(f!=null && l!=null && ms.filter(v=>v!=null).length>=2){
        const d=l-f, better=d>0;
        html += `<td><span class="${better?'pos':'neg'}">${d>0?'+':''}${d.toFixed(2)} m/s</span></td>`;
      } else html+=`<td>—</td>`;
      html+=`</tr>`;
    });
    html += `</tbody></table></div>`;

    html += `<h3>🏁 Vitesse moyenne (km/h)</h3><div class="tbl-wrap"><table><thead><tr><th>Sprint</th>`;
    selectedPeriods.forEach(p=>html+=`<th>${p}</th>`);
    html += `</tr></thead><tbody>`;
    presentKeys.forEach(k=>{
      const dist = DIST[k];
      html += `<tr><td><strong>${LABELS[k]}</strong></td>`;
      selectedPeriods.forEach(p=>{
        const t = getVal(j,p,k);
        const kmh = t!=null && t>0 ? (dist/t)*3.6 : null;
        html += `<td>${kmh!=null?kmh.toFixed(2)+' km/h':'—'}</td>`;
      });
      html+=`</tr>`;
    });
    html += `</tbody></table></div>`;
  }

  // === Graphiques ===
  presentKeys.forEach((k,i)=>{
    const id = 'chart_'+i;
    html += `<h3>${LABELS[k]} (${UNITS[k]||''})</h3>
      <div class="chart-wrap"><canvas id="${id}"></canvas></div>`;
  });

  html += `</div>`;
  content.innerHTML = html;

  // Rendu Chart.js
  presentKeys.forEach((k,i)=>{
    const ctx = document.getElementById('chart_'+i);
    const data = selectedPeriods.map(p=>getVal(j,p,k));
    const c = new Chart(ctx,{
      type:'line',
      data:{
        labels:selectedPeriods,
        datasets:[{
          label:LABELS[k]+' ('+(UNITS[k]||'')+')',
          data,
          borderColor:'#e94560',
          backgroundColor:'rgba(233,69,96,.15)',
          tension:.3,
          fill:true,
          pointRadius:6,
          pointBackgroundColor:'#f5a623',
          spanGaps:true
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:'#e6edf3'}}},
        scales:{
          x:{ticks:{color:'#8b949e'},grid:{color:'#30363d'}},
          y:{ticks:{color:'#8b949e'},grid:{color:'#30363d'},reverse:INVERT.includes(k)}
        }
      }
    });
    charts.push(c);
  });
}

function openCat(k){selectedCat=k;render();window.scrollTo(0,0);}
function closeCat(){selectedCat=null;render();}

// ====== START ======
initUI();
render();
</script>
</body>
</html>
