<meta charset="UTF-8">
<title>Dashboard U18F 25/26</title>

<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1f2630;--border:#30363d;--accent:#e94560;--accent2:#f5a623;--ok:#2ea043;--ko:#da3633;--muted:#8b949e;--text:#e6edf3}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:16px;min-height:100vh}
.header{background:linear-gradient(135deg,#e94560,#c13651);padding:18px;border-radius:12px;margin-bottom:16px;text-align:center}
.header h1{font-size:1.4rem}
.controls{background:var(--card);padding:14px;border-radius:10px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.controls label{font-weight:600;color:var(--muted);font-size:.85rem}
select{background:var(--card2);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:.9rem;min-width:200px}
.pchk{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:2px solid var(--border);border-radius:16px;cursor:pointer;font-size:.82rem;color:var(--muted);transition:all .2s;user-select:none}
.pchk.active{border-color:var(--accent);color:var(--accent);background:rgba(233,69,96,.08)}
.pchk input{display:none}
.periods{display:flex;gap:8px;flex-wrap:wrap}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:5px}
.cat{background:var(--card2);border:2px solid var(--border);border-radius:10px;padding:18px 14px;cursor:pointer;text-align:center;transition:all .2s}
.cat:hover{border-color:var(--accent);transform:translateY(-2px)}
.cat .ico{font-size:1.8rem;margin-bottom:6px}
.cat .name{font-weight:600;font-size:.9rem}
.cat .desc{color:var(--muted);font-size:.75rem;margin-top:3px}
.section{background:var(--card);border-radius:12px;padding:20px;margin-bottom:16px}
.section h2{margin-bottom:14px;font-size:1.05rem}
.section h3{margin:18px 0 10px;color:var(--accent2);font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card2);padding:14px;border-radius:8px;border-left:3px solid var(--accent)}
.stat .label{font-size:.75rem;color:var(--muted);margin-bottom:4px}
.stat .val{font-size:1.3rem;font-weight:700;color:var(--accent)}
.stat .unit{font-size:.75rem;color:var(--muted);margin-left:3px}
.evo{font-size:.75rem;margin-top:4px;font-weight:600}
.evo.pos{color:var(--ok)}
.evo.neg{color:var(--ko)}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.85rem}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--border)}
th{background:var(--card2);color:var(--accent2);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.5px}
td:first-child,th:first-child{text-align:left}
tr:hover td{background:rgba(255,255,255,.02)}
.pos{color:var(--ok);font-weight:600}
.neg{color:var(--ko);font-weight:600}
.chart-wrap{background:var(--card2);border-radius:8px;padding:12px;margin-top:10px;height:300px;position:relative}
.back{background:var(--card2);color:var(--text);border:1px solid var(--border);padding:8px 16px;border-radius:6px;cursor:pointer;margin-bottom:12px;font-size:.85rem}
.back:hover{border-color:var(--accent);color:var(--accent)}
.subtitle{color:var(--muted);font-size:.8rem;margin-top:4px}
.tbl-wrap{overflow-x:auto;margin-top:8px}
  .tabBtn{background:var(--card);color:var(--muted);border:2px solid var(--border);padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;transition:all .2s}
.tabBtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabBtn:hover{color:var(--text)}
.rank{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card2);border-radius:8px;margin-bottom:6px;border-left:4px solid var(--border)}
.rank.top1{border-left-color:#ffd700}
.rank.top2{border-left-color:#c0c0c0}
.rank.top3{border-left-color:#cd7f32}
.rank.me{background:rgba(233,69,96,.15);border-left-color:var(--accent)}
.rank .pos{font-size:1.2rem;font-weight:700;min-width:40px;color:var(--accent2)}
.rank .nm{flex:1;font-weight:600}
.rank .ps{color:var(--muted);font-size:.82rem;margin-right:10px}
.rank .vl{font-weight:700;color:var(--accent2);font-size:1.05rem}
.cmpChip{padding:6px 12px;border:2px solid var(--border);border-radius:16px;cursor:pointer;font-size:.82rem;color:var(--muted);user-select:none;transition:all .2s}
.cmpChip.active{border-color:var(--accent);color:var(--text);background:rgba(233,69,96,.15)}
.cmpChip:hover{color:var(--text)}
</style>
</head>

const DATA = {};
for (const [mois, players] of Object.entries(sessions)) {
  for (const [nom, raw] of Object.entries(players)) {
    if (!DATA[nom]) DATA[nom] = { poste: null, stats: {} };
    if (raw.poste) DATA[nom].poste = raw.poste; // dernier poste connu (ordre Sept→Mai)
    const { poste, note, ift_30_15, ...stats } = raw;
    // ift_30_15 (Sept) → palier
    if (ift_30_15 != null) stats.palier = ift_30_15;
    DATA[nom].stats[mois] = stats;
  }
}


// distances pour calcul m/s par sprint
const DIST = {v10:10,v20:20,v25:25,v30:30,v40:40,v50:50};

let selectedPeriods = [...PERIODS];
let selectedCat = null;
let charts = [];
</script>
<script>
// ====== INIT ======
function initUI(){
  const sel = document.getElementById('selJ');
  Object.keys(DATA).sort().forEach(n=>{
    const o=document.createElement('option');o.value=n;o.textContent=n+' ('+DATA[n].poste+')';sel.appendChild(o);
  });
  const pc = document.getElementById('periods');
  PERIODS.forEach(p=>{
    const lbl=document.createElement('label');
    lbl.className='pchk active';
    lbl.innerHTML=`<input type="checkbox" checked value="${p}">${p}`;
    lbl.querySelector('input').addEventListener('change',e=>{
      if(e.target.checked){selectedPeriods.push(p);lbl.classList.add('active');}
      else{selectedPeriods=selectedPeriods.filter(x=>x!==p);lbl.classList.remove('active');}
      selectedPeriods.sort((a,b)=>PERIODS.indexOf(a)-PERIODS.indexOf(b));
      render();
    });
    pc.appendChild(lbl);
  });
}

function getVal(j,p,k){
  const s = DATA[j].stats[p];
  return s && s[k]!=null ? s[k] : null;
}

function fmt(v,k){
  if(v==null) return '—';
  const u = UNITS[k]||'';
  return (typeof v==='number'?(+v.toFixed(2)):v)+(u?' '+u:'');
}

function evolBadge(first,last,key){
  if(first==null||last==null) return '<span class="muted">—</span>';
  const d = last-first;
  if(Math.abs(d)<0.001) return '<span>=</span>';
  const better = INVERT.includes(key) ? d<0 : d>0;
  const sign = d>0?'+':'';
  return `<span class="${better?'pos':'neg'}">${sign}${d.toFixed(2)} ${UNITS[key]||''}</span>`;
}

function destroyCharts(){charts.forEach(c=>c.destroy());charts=[];}

// ====== RENDU PRINCIPAL ======
function render(){
  destroyCharts();
  const j = document.getElementById('selJ').value;
  const content = document.getElementById('content');
  if(selectedCat){renderCat(j); return;}

  // Vue d'ensemble : cartes catégories + évolution globale par unité
  let html = `<div class="section"><h2>👤 ${j} — ${DATA[j].poste}</h2>
    <div class="cats">`;
  Object.entries(CATS).forEach(([k,c])=>{
    html += `<div class="cat" onclick="openCat('${k}')">
      <div class="ico">${c.ico}</div>
      <div class="name">${c.name}</div>
      <div class="desc">${c.desc}</div></div>`;
  });
  html += `</div></div>`;

  // Évolution globale — regroupée par unité
  html += `<div class="section"><h2>📊 Évolution globale</h2>`;
  
  // Récupérer toutes les clés présentes pour cette joueuse
  const allKeys = new Set();
  selectedPeriods.forEach(p=>{
    const s = DATA[j].stats[p];
    if(s) Object.keys(s).forEach(k=>{if(LABELS[k]) allKeys.add(k);});
  });

  // Grouper par unité
  const byUnit = {};
  allKeys.forEach(k=>{
    const u = UNITS[k]||'autre';
    if(!byUnit[u]) byUnit[u]=[];
    byUnit[u].push(k);
  });

  const unitOrder = ['kg','cm','m','s',''];
  const unitNames = {kg:'Charges (kg)', cm:'Distances (cm)', m:'Distance (m)', s:'Temps (s)', '':'Palier'};

  unitOrder.forEach(u=>{
    if(!byUnit[u]||byUnit[u].length===0) return;
    const keys = byUnit[u].sort((a,b)=>Object.keys(LABELS).indexOf(a)-Object.keys(LABELS).indexOf(b));
    html += `<h3>${unitNames[u]||u}</h3><div class="tbl-wrap"><table>
      <thead><tr><th>Indicateur</th>`;
    selectedPeriods.forEach(p=>html+=`<th>${p}</th>`);
    html += `<th>Évolution</th></tr></thead><tbody>`;
    keys.forEach(k=>{
      html += `<tr><td><strong>${LABELS[k]}</strong></td>`;
      const vals = selectedPeriods.map(p=>getVal(j,p,k));
      vals.forEach(v=>html+=`<td>${fmt(v,k)}</td>`);
      const firstV = vals.find(v=>v!=null);
      const lastV = [...vals].reverse().find(v=>v!=null);
      html += `<td>${vals.filter(v=>v!=null).length>=2 ? evolBadge(firstV,lastV,k) : '—'}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  });

  if(allKeys.size===0) html += `<p class="subtitle">Aucune donnée pour les périodes sélectionnées.</p>`;
  html += `</div>`;

  content.innerHTML = html;
}

// ====== VUE CATÉGORIE ======
function renderCat(j){
  destroyCharts();
  const cat = CATS[selectedCat];
  const content = document.getElementById('content');
  let html = `<button class="back" onclick="closeCat()">← Retour</button>
    <div class="section"><h2>${cat.ico} ${cat.name} — ${j}</h2>`;

  // Tableau principal
  html += `<div class="tbl-wrap"><table><thead><tr><th>Indicateur</th>`;
  selectedPeriods.forEach(p=>html+=`<th>${p}</th>`);
  html += `<th>Évolution</th></tr></thead><tbody>`;
  
  const presentKeys = cat.keys.filter(k=>{
    return selectedPeriods.some(p=>getVal(j,p,k)!=null);
  });

  presentKeys.forEach(k=>{
    html += `<tr><td><strong>${LABELS[k]}</strong></td>`;
    const vals = selectedPeriods.map(p=>getVal(j,p,k));
    vals.forEach(v=>html+=`<td>${fmt(v,k)}</td>`);
    const firstV = vals.find(v=>v!=null);
    const lastV = [...vals].reverse().find(v=>v!=null);
    html += `<td>${vals.filter(v=>v!=null).length>=2 ? evolBadge(firstV,lastV,k) : '—'}</td></tr>`;
  });
  html += `</tbody></table></div>`;

  // === Spécial VITESSE : tableau m/s et km/h ===
  if(selectedCat==='vitesse' && presentKeys.length>0){
    html += `<h3>🚀 Vitesse moyenne (m/s)</h3><div class="tbl-wrap"><table><thead><tr><th>Sprint</th>`;
    selectedPeriods.forEach(p=>html+=`<th>${p}</th>`);
    html += `<th>Évolution</th></tr></thead><tbody>`;
    presentKeys.forEach(k=>{
      const dist = DIST[k];
      html += `<tr><td><strong>${LABELS[k]}</strong></td>`;
      const ms = selectedPeriods.map(p=>{
        const t = getVal(j,p,k);
        return t!=null && t>0 ? dist/t : null;
      });
      ms.forEach(v=>html+=`<td>${v!=null?v.toFixed(2)+' m/s':'—'}</td>`);
      const f = ms.find(v=>v!=null), l = [...ms].reverse().find(v=>v!=null);
      if(f!=null && l!=null && ms.filter(v=>v!=null).length>=2){
        const d=l-f, better=d>0;
        html += `<td><span class="${better?'pos':'neg'}">${d>0?'+':''}${d.toFixed(2)} m/s</span></td>`;
      } else html+=`<td>—</td>`;
      html+=`</tr>`;
    });
    html += `</tbody></table></div>`;

    html += `<h3>🏁 Vitesse moyenne (km/h)</h3><div class="tbl-wrap"><table><thead><tr><th>Sprint</th>`;
    selectedPeriods.forEach(p=>html+=`<th>${p}</th>`);
    html += `</tr></thead><tbody>`;
    presentKeys.forEach(k=>{
      const dist = DIST[k];
      html += `<tr><td><strong>${LABELS[k]}</strong></td>`;
      selectedPeriods.forEach(p=>{
        const t = getVal(j,p,k);
        const kmh = t!=null && t>0 ? (dist/t)*3.6 : null;
        html += `<td>${kmh!=null?kmh.toFixed(2)+' km/h':'—'}</td>`;
      });
      html+=`</tr>`;
    });
    html += `</tbody></table></div>`;
  }

  // === Graphiques ===
  presentKeys.forEach((k,i)=>{
    const id = 'chart_'+i;
    html += `<h3>${LABELS[k]} (${UNITS[k]||''})</h3>
      <div class="chart-wrap"><canvas id="${id}"></canvas></div>`;
  });

  html += `</div>`;
  content.innerHTML = html;

  // Rendu Chart.js
  presentKeys.forEach((k,i)=>{
    const ctx = document.getElementById('chart_'+i);
    const data = selectedPeriods.map(p=>getVal(j,p,k));
    const c = new Chart(ctx,{
      type:'line',
      data:{
        labels:selectedPeriods,
        datasets:[{
          label:LABELS[k]+' ('+(UNITS[k]||'')+')',
          data,
          borderColor:'#e94560',
          backgroundColor:'rgba(233,69,96,.15)',
          tension:.3,
          fill:true,
          pointRadius:6,
          pointBackgroundColor:'#f5a623',
          spanGaps:true
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:'#e6edf3'}}},
        scales:{
          x:{ticks:{color:'#8b949e'},grid:{color:'#30363d'}},
          y:{ticks:{color:'#8b949e'},grid:{color:'#30363d'},reverse:INVERT.includes(k)}
        }
      }
    });
    charts.push(c);
  });
}

function openCat(k){selectedCat=k;render();window.scrollTo(0,0);}
function closeCat(){selectedCat=null;render();}

// ====== ÉTAT GLOBAL ======
let currentTab = 'indiv';
let cmpSelected = []; // joueuses sélectionnées pour comparaison

// ====== INIT NOUVEAUX CONTRÔLES ======
function initExtras(){
  // Mouvements (toutes les clés de LABELS)
  const selMove = document.getElementById('selMove');
  Object.entries(LABELS).forEach(([k,v])=>{
    const o=document.createElement('option');o.value=k;o.textContent=v+(UNITS[k]?' ('+UNITS[k]+')':'');
    selMove.appendChild(o);
  });
  selMove.value='dc_1rm';
  selMove.onchange=renderLeader;

  // Périodes leaderboard
  const selPL = document.getElementById('selPeriodL');
  PERIODS.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;selPL.appendChild(o);});
  selPL.value='Janvier';
  selPL.onchange=renderLeader;

  // Postes (uniques)
  const postes = [...new Set(Object.values(DATA).map(d=>d.poste).filter(Boolean))].sort();
  const selP = document.getElementById('selPoste');
  postes.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;selP.appendChild(o);});
  selP.onchange=renderLeader;

  // Comparaison : chips joueuses
  const cmpDiv = document.getElementById('cmpPlayers');
  Object.keys(DATA).sort().forEach(n=>{
    const c=document.createElement('div');
    c.className='cmpChip';c.textContent=n;
    c.onclick=()=>{
      if(cmpSelected.includes(n)){cmpSelected=cmpSelected.filter(x=>x!==n);c.classList.remove('active');}
      else{cmpSelected.push(n);c.classList.add('active');}
      renderCompare();
    };
    cmpDiv.appendChild(c);
  });

  // Période comparaison
  const selPC = document.getElementById('selPeriodC');
  PERIODS.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;selPC.appendChild(o);});
  selPC.value='Janvier';
  selPC.onchange=renderCompare;
}

// ====== TABS ======
function setTab(t){
  currentTab=t;
  document.querySelectorAll('.tabBtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.getElementById('ctrlIndiv').style.display = t==='indiv'?'flex':'none';
  document.getElementById('ctrlLeader').style.display = t==='leader'?'flex':'none';
  document.getElementById('ctrlCompare').style.display = t==='compare'?'flex':'none';
  destroyCharts();
  if(t==='indiv') render();
  else if(t==='leader') renderLeader();
  else renderCompare();
}

// ====== LEADERBOARD ======
function renderLeader(){
  destroyCharts();
  const move = document.getElementById('selMove').value;
  const period = document.getElementById('selPeriodL').value;
  const posteFilter = document.getElementById('selPoste').value;
  const content = document.getElementById('content');

  let list = Object.entries(DATA)
    .filter(([n,d])=>!posteFilter || d.poste===posteFilter)
    .map(([n,d])=>({nom:n,poste:d.poste,val:d.stats[period]?.[move]}))
    .filter(x=>x.val!=null);

  list.sort((a,b)=>INVERT.includes(move) ? a.val-b.val : b.val-a.val);

  let html = `<div class="section"><h2>🏆 Classement — ${LABELS[move]} (${period})${posteFilter?' • '+posteFilter:''}</h2>`;
  if(list.length===0){
    html += `<p class="subtitle">Aucune donnée pour ces critères.</p></div>`;
    content.innerHTML=html;return;
  }

  // Si vitesse : afficher aussi m/s et km/h
  const isSpeed = DIST[move]!=null;

  list.forEach((p,i)=>{
    const cls = i===0?'top1':i===1?'top2':i===2?'top3':'';
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1);
    let extra = '';
    if(isSpeed){
      const ms = (DIST[move]/p.val).toFixed(2);
      const kmh = ((DIST[move]/p.val)*3.6).toFixed(1);
      extra = ` <span style="color:var(--muted);font-size:.82rem">(${ms} m/s • ${kmh} km/h)</span>`;
    }
    html += `<div class="rank ${cls}">
      <div class="pos">${medal}</div>
      <div class="nm">${p.nom}</div>
      <div class="ps">${p.poste||''}</div>
      <div class="vl">${p.val} ${UNITS[move]||''}${extra}</div>
    </div>`;
  });
  html += `</div>`;
  content.innerHTML = html;
}

// ====== COMPARAISON ======
function renderCompare(){
  destroyCharts();
  const period = document.getElementById('selPeriodC').value;
  const content = document.getElementById('content');

  if(cmpSelected.length<1){
    content.innerHTML = `<div class="section"><h2>⚔️ Comparaison</h2>
      <p class="subtitle">Sélectionne au moins 1 joueuse ci-dessus pour commencer la comparaison.</p></div>`;
    return;
  }

  // Toutes les clés présentes pour les joueuses sélectionnées sur cette période
  const allKeys = new Set();
  cmpSelected.forEach(j=>{
    const s = DATA[j].stats[period];
    if(s) Object.keys(s).forEach(k=>{if(LABELS[k]) allKeys.add(k);});
  });

  let html = `<div class="section"><h2>⚔️ Comparaison — ${period}</h2>`;

  if(allKeys.size===0){
    html += `<p class="subtitle">Aucune donnée pour ces joueuses sur cette période.</p></div>`;
    content.innerHTML=html;return;
  }

  // Grouper par unité
  const byUnit = {};
  allKeys.forEach(k=>{const u=UNITS[k]||'autre';if(!byUnit[u])byUnit[u]=[];byUnit[u].push(k);});
  const unitOrder = ['kg','cm','m','s',''];
  const unitNames = {kg:'Charges (kg)',cm:'Distances (cm)',m:'Distance (m)',s:'Temps (s)','':'Palier'};

  unitOrder.forEach(u=>{
    if(!byUnit[u]||byUnit[u].length===0) return;
    const keys = byUnit[u].sort((a,b)=>Object.keys(LABELS).indexOf(a)-Object.keys(LABELS).indexOf(b));
    html += `<h3>${unitNames[u]||u}</h3><div class="tbl-wrap"><table>
      <thead><tr><th>Indicateur</th>`;
    cmpSelected.forEach(j=>html+=`<th>${j}<br><span style="color:var(--muted);font-weight:400;font-size:.75rem">${DATA[j].poste||''}</span></th>`);
    html += `<th>Meilleure</th></tr></thead><tbody>`;
    keys.forEach(k=>{
      html += `<tr><td><strong>${LABELS[k]}</strong></td>`;
      const vals = cmpSelected.map(j=>DATA[j].stats[period]?.[k]);
      const valid = vals.filter(v=>v!=null);
      let best = null;
      if(valid.length>0) best = INVERT.includes(k) ? Math.min(...valid) : Math.max(...valid);
      vals.forEach(v=>{
        const isBest = v!=null && v===best && valid.length>1;
        html += `<td style="${isBest?'color:#2ea043;font-weight:700':''}">${v!=null?v+(UNITS[k]?' '+UNITS[k]:''):'—'}</td>`;
      });
      const bestIdx = vals.indexOf(best);
      html += `<td style="color:var(--accent2);font-weight:600">${bestIdx>=0?cmpSelected[bestIdx]:'—'}</td>`;
      html += `</tr>`;
    });
    html += `</tbody></table></div>`;
  });

  // Graphique radar si >=2 joueuses et plusieurs métriques
  if(cmpSelected.length>=2 && allKeys.size>=3){
    html += `<h3>📊 Profil comparatif (normalisé)</h3>
      <div class="chart-wrap" style="height:400px"><canvas id="radarCmp"></canvas></div>
      <p class="subtitle" style="margin-top:6px;font-size:.78rem">Valeurs normalisées 0-100 (100 = meilleure perf entre joueuses sélectionnées)</p>`;
  }

  html += `</div>`;
  content.innerHTML = html;

  // Radar
  if(cmpSelected.length>=2 && allKeys.size>=3){
    const keys = [...allKeys];
    const colors = ['#e94560','#f5a623','#2ea043','#58a6ff','#bc8cff','#ff7b72','#79c0ff'];
    const datasets = cmpSelected.map((j,i)=>{
      const data = keys.map(k=>{
        const v = DATA[j].stats[period]?.[k];
        if(v==null) return 0;
        const allV = cmpSelected.map(x=>DATA[x].stats[period]?.[k]).filter(x=>x!=null);
        if(allV.length===0) return 0;
        const mn = Math.min(...allV), mx = Math.max(...allV);
        if(mx===mn) return 100;
        return INVERT.includes(k) ? ((mx-v)/(mx-mn))*100 : ((v-mn)/(mx-mn))*100;
      });
      return {label:j,data,borderColor:colors[i%colors.length],backgroundColor:colors[i%colors.length]+'33',borderWidth:2};
    });
    const ctx = document.getElementById('radarCmp');
    const c = new Chart(ctx,{
      type:'radar',
      data:{labels:keys.map(k=>LABELS[k]),datasets},
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:'#e6edf3'}}},
        scales:{r:{
          angleLines:{color:'#30363d'},grid:{color:'#30363d'},
          pointLabels:{color:'#e6edf3',font:{size:11}},
          ticks:{color:'#8b949e',backdropColor:'transparent'},
          suggestedMin:0,suggestedMax:100
        }}
      }
    });
    charts.push(c);
  }
}

initExtras();
initUI();
render();
</script>
