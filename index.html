<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--card2:#1c2128;--border:#30363d;--accent:#e94560;--blue:#0f3460;--gold:#f5a623;--ok:#2ea043;--ko:#da3633;--txt:#e6edf3;--muted:#8b949e}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.header{background:linear-gradient(135deg,var(--card),var(--blue));padding:14px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:10px}
.htitle h1{font-size:1.2rem}
.htitle p{font-size:.72rem;color:var(--muted)}
.hlogo{font-size:1.8rem;margin-right:10px}
.hleft{display:flex;align-items:center}
.container{padding:20px;max-width:1400px;margin:0 auto}
.controls{background:var(--card);padding:20px;border-radius:12px;margin-bottom:20px;display:flex;gap:15px;flex-wrap:wrap;align-items:center}
.controls label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:5px}
.controls select{background:var(--card2);color:var(--txt);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:.9rem;min-width:180px}
.periods{display:flex;gap:8px;flex-wrap:wrap}
.pchk{display:flex;align-items:center;gap:5px;background:var(--card2);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:.85rem;border:1px solid var(--border)}
.pchk input{cursor:pointer}
.pchk.active{background:var(--accent);border-color:var(--accent)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px}
.cat{background:linear-gradient(135deg,var(--card),var(--card2));padding:20px;border-radius:12px;border:1px solid var(--border);cursor:pointer;text-align:center;transition:all .2s}
.cat:hover{transform:translateY(-3px);border-color:var(--accent)}
.cat .ico{font-size:2rem;margin-bottom:8px}
.cat .name{font-weight:600;margin-bottom:4px}
.cat .desc{font-size:.75rem;color:var(--muted)}
.section{background:var(--card);padding:20px;border-radius:12px;margin-bottom:20px;border:1px solid var(--border)}
.section h2{margin-bottom:15px;font-size:1.1rem;color:var(--accent);display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card2);padding:15px;border-radius:8px;text-align:center;border:1px solid var(--border)}
.stat .label{font-size:.75rem;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.stat .val{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat .unit{font-size:.75rem;color:var(--muted);margin-left:3px}
.evo{font-size:.75rem;margin-top:4px;font-weight:600}
.evo.pos{color:var(--ok)}
.evo.neg{color:var(--ko)}
.chart-wrap{background:var(--card2);padding:15px;border-radius:8px;margin-top:15px;height:300px;position:relative}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--border);font-size:.85rem}
th{background:var(--card2);color:var(--accent);font-weight:600}
.back{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;margin-bottom:15px}
.hidden{display:none}
.profile{background:linear-gradient(135deg,var(--blue),var(--card));padding:25px;border-radius:12px;margin-bottom:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.avatar{width:80px;height:80px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700}
.pinfo h2{font-size:1.5rem;margin-bottom:5px}
.pinfo p{color:var(--muted);font-size:.9rem}
.tag{display:inline-block;background:var(--accent);padding:3px 10px;border-radius:12px;font-size:.75rem;margin-right:5px;margin-top:5px}
</style>
</head>

    Novembre:{poids:64.6,yoyo:1080,dc_1rm:47.5,tirage_1rm:62.5,sdt_1rm:90,hipthrust:145,v10:1.83,v20:3.24,v25:3.96,v50:7.38,broad:192},
    Janvier:{taille:164,squat_3rm:105,tirage_3rm:60,v10:1.97,v20:3.41,v30:4.79,v40:6.13,yoyo:960}
  }},
  "Romane": {poste:"Demi-Ouverture", stats:{
    Septembre:{poids:58.1,yoyo:720,dc_1rm:35,tirage_1rm:42.5,sdt_1rm:75,v10:1.99,v20:3.52,v25:4.22,v50:8.03,broad:189},
    Novembre:{poids:59.4,yoyo:720,dc_1rm:42.5,tirage_1rm:50,sdt_1rm:110,v10:1.83,v20:3.26,v25:3.97,v50:7.37},
    Janvier:{dc_3rm:45,tirage_3rm:42.5,v10:1.79,v20:3.15,v30:4.43,v40:5.83}
  }},
  "Shayna": {poste:"3e Ligne", stats:{
    Septembre:{poids:66.3,yoyo:640,dc_1rm:38,tirage_1rm:38.5,sdt_1rm:80,hipthrust:110,v10:2.19,v20:3.88,v25:4.75,v50:8.5},
    Novembre:{poids:66.2,yoyo:640,dc_1rm:40,tirage_1rm:50,sdt_1rm:110,v10:2.06,v20:3.75},
    Janvier:{taille:162,dc_3rm:35,squat_3rm:85,tirage_3rm:50,v10:2.07,v20:3.62,v30:5.17,v40:6.75}
  }},
  "Zoé": {poste:"2e Ligne", stats:{
    Septembre:{poids:63.9,yoyo:920,dc_1rm:50,tirage_1rm:40,sdt_1rm:100,hipthrust:125,v10:2.07,v20:3.65,v25:4.55,v50:8.64,broad:164},
    Novembre:{poids:63.7,yoyo:920,dc_1rm:55,tirage_1rm:60,sdt_1rm:125,v10:1.89,v20:3.37,v25:4.21,v50:7.93,broad:167},
    Janvier:{taille:163,poids:68.15,yoyo:960,dc_3rm:55,squat_3rm:110,tirage_3rm:60,v10:1.86,v20:3.26,v30:4.59,v40:6.02,broad:189}
  }}
};

const LABELS = {
  taille:"Taille",poids:"Poids",yoyo:"Yo-Yo Test",
  dc_1rm:"1RM DC",tirage_1rm:"1RM Tirage",sdt_1rm:"1RM SDT",hipthrust:"Hip Thrust",
  dc_3rm:"3RM DC",squat_3rm:"3RM Squat",tirage_3rm:"3RM Tirage",
  v10:"10m",v20:"20m",v25:"25m",v30:"30m",v40:"40m",v50:"50m",broad:"Broad Jump"
};
const UNITS = {
  taille:"cm",poids:"kg",yoyo:"m",broad:"cm",
  dc_1rm:"kg",tirage_1rm:"kg",sdt_1rm:"kg",hipthrust:"kg",
  dc_3rm:"kg",squat_3rm:"kg",tirage_3rm:"kg",
  v10:"s",v20:"s",v25:"s",v30:"s",v40:"s",v50:"s"
};
const CATS = {
  antrho:{name:"Anthropométrie",ico:"📏",keys:["taille","poids"]},
  aero:{name:"Endurance",ico:"🏃‍♀️",keys:["yoyo"]},
  force1:{name:"Force 1RM",ico:"💪",keys:["dc_1rm","tirage_1rm","sdt_1rm","hipthrust"]},
  force3:{name:"Force 3RM",ico:"🏋️‍♀️",keys:["dc_3rm","squat_3rm","tirage_3rm"]},
  vitesse:{name:"Vitesse",ico:"⚡",keys:["v10","v20","v25","v30","v40","v50"]},
  explo:{name:"Explosivité",ico:"🚀",keys:["broad"]}
};
// invert = true => plus petit = mieux (sprints)
const INVERT = ["v10","v20","v25","v30","v40","v50"];
</script>
<script>
let selectedPlayer = null;
let selectedPeriods = ['Septembre','Novembre','Janvier'];
let selectedCat = null;

// Init dropdown joueuses
function initUI(){
  const sel = document.getElementById('selJ');
  const names = Object.keys(DATA).sort();
  sel.innerHTML = '<option value="">-- Choisir une joueuse --</option>' +
    names.map(n=>`<option value="${n}">${n} (${DATA[n].poste})</option>`).join('');
  
  // Périodes
  const pdiv = document.getElementById('periods');
  pdiv.innerHTML = PERIODS.map(p=>`
    <label class="pchk ${selectedPeriods.includes(p)?'active':''}">
      <input type="checkbox" value="${p}" ${selectedPeriods.includes(p)?'checked':''} onchange="togglePeriod('${p}',this.checked)">
      ${p}
    </label>
  `).join('');
}

function togglePeriod(p,checked){
  if(checked) selectedPeriods.push(p);
  else selectedPeriods = selectedPeriods.filter(x=>x!==p);
  selectedPeriods.sort((a,b)=>PERIODS.indexOf(a)-PERIODS.indexOf(b));
  initUI();
  document.getElementById('selJ').value = selectedPlayer||'';
  render();
}

function render(){
  const name = document.getElementById('selJ').value;
  selectedPlayer = name;
  const c = document.getElementById('content');
  
  if(!name){
    c.innerHTML = `<div class="section"><h2>👋 Bienvenue</h2><p style="color:var(--muted)">Sélectionne une joueuse pour afficher son dashboard complet.</p></div>`;
    return;
  }
  
  if(selectedCat){
    renderCategory(name);
  } else {
    renderDashboard(name);
  }
}

// ===== DASHBOARD GÉNÉRAL =====
function renderDashboard(name){
  const p = DATA[name];
  const c = document.getElementById('content');
  
  // Profil
  let html = `
    <div class="profile">
      <div class="avatar">${name[0]}</div>
      <div class="pinfo">
        <h2>${name}</h2>
        <p>Poste : <strong>${p.poste}</strong></p>
        <div>
          ${selectedPeriods.map(per=>p.stats[per]?`<span class="tag">${per}</span>`:'').join('')}
        </div>
      </div>
    </div>
  `;
  
  // Vue d'ensemble : stats clés
  html += `<div class="section"><h2>📊 Vue d'ensemble — Dernière période évaluée</h2>`;
  const lastPer = [...selectedPeriods].reverse().find(per=>p.stats[per]);
  const firstPer = selectedPeriods.find(per=>p.stats[per]);
  
  if(lastPer){
    const keyStats = ['poids','yoyo','dc_1rm','sdt_1rm','v10','v20','broad'];
    html += `<div class="grid">`;
    keyStats.forEach(k=>{
      const v = p.stats[lastPer][k];
      if(v===undefined) return;
      const evo = computeEvo(p,k,firstPer,lastPer);
      html += `<div class="stat">
        <div class="label">${LABELS[k]}</div>
        <div class="val">${v}<span class="unit">${UNITS[k]||''}</span></div>
        ${evo?`<div class="evo ${evo.cls}">${evo.txt}</div>`:''}
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  
  // Catégories cliquables
  html += `<h2 style="margin:20px 0 10px;color:var(--accent)">🗂️ Catégories détaillées</h2>`;
  html += `<div class="cats">`;
  Object.keys(CATS).forEach(k=>{
    const cat = CATS[k];
    const has = cat.keys.some(key=>selectedPeriods.some(per=>p.stats[per]&&p.stats[per][key]!==undefined));
    if(!has) return;
    html += `<div class="cat" onclick="openCat('${k}')">
      <div class="ico">${cat.ico}</div>
      <div class="name">${cat.name}</div>
      <div class="desc">${cat.keys.length} indicateurs</div>
    </div>`;
  });
  html += `</div>`;
  
  // Graphique global évolution (poids + yoyo normalisés)
  html += `<div class="section"><h2>📈 Évolution générale</h2>
    <div class="chart-wrap"><canvas id="globalChart"></canvas></div>
  </div>`;
  
  c.innerHTML = html;
  
  // Build global chart
  setTimeout(()=>buildGlobalChart(name),50);
}

function computeEvo(p,key,firstPer,lastPer){
  if(!firstPer||!lastPer||firstPer===lastPer) return null;
  const a = p.stats[firstPer]?.[key];
  const b = p.stats[lastPer]?.[key];
  if(a===undefined||b===undefined||a===0) return null;
  const diff = b-a;
  const pct = (diff/a)*100;
  const better = INVERT.includes(key) ? diff<0 : diff>0;
  const arrow = diff>0?'▲':(diff<0?'▼':'=');
  return {
    cls: better?'pos':'neg',
    txt:`${arrow} ${pct>0?'+':''}${pct.toFixed(1)}%`
  };
}

function buildGlobalChart(name){
  const p = DATA[name];
  const labels = selectedPeriods.filter(per=>p.stats[per]);
  const ds = [];
  const colors = ['#e94560','#f5a623','#2ea043','#58a6ff','#bc8cff','#ff7b72'];
  ['poids','yoyo','dc_1rm','sdt_1rm','v50','broad'].forEach((k,i)=>{
    const data = labels.map(per=>p.stats[per][k]??null);
    if(data.some(v=>v!==null)){
      ds.push({
        label:LABELS[k],
        data,
        borderColor:colors[i],
        backgroundColor:colors[i]+'33',
        tension:0.3,
        yAxisID: (k==='yoyo'||k==='broad')?'y2':'y1'
      });
    }
  });
  new Chart(document.getElementById('globalChart'),{
    type:'line',
    data:{labels,datasets:ds},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#e6edf3'}}},
      scales:{
        x:{ticks:{color:'#8b949e'},grid:{color:'#30363d'}},
        y1:{position:'left',ticks:{color:'#8b949e'},grid:{color:'#30363d'}},
        y2:{position:'right',ticks:{color:'#8b949e'},grid:{display:false}}
      }
    }
  });
}

function openCat(k){
  selectedCat = k;
  render();
}
function closeCat(){
  selectedCat = null;
  render();
}
</script>
<script>
// ===== VUE CATÉGORIE DÉTAILLÉE =====
function renderCategory(name){
  const p = DATA[name];
  const cat = CATS[selectedCat];
  const c = document.getElementById('content');
  
  let html = `
    <button class="back" onclick="closeCat()">← Retour au dashboard</button>
    <div class="section">
      <h2>${cat.ico} ${cat.name} — ${name}</h2>
  `;
  
  // Tableau comparatif
  html += `<table>
    <thead><tr><th>Indicateur</th>
    ${selectedPeriods.map(per=>p.stats[per]?`<th>${per}</th>`:'').join('')}
    <th>Évolution</th></tr></thead>
    <tbody>`;
  
  const firstPer = selectedPeriods.find(per=>p.stats[per]);
  const lastPer = [...selectedPeriods].reverse().find(per=>p.stats[per]);
  
  cat.keys.forEach(k=>{
    const hasAny = selectedPeriods.some(per=>p.stats[per]&&p.stats[per][k]!==undefined);
    if(!hasAny) return;
    const evo = computeEvo(p,k,firstPer,lastPer);
    html += `<tr>
      <td><strong>${LABELS[k]}</strong> <span style="color:var(--muted);font-size:.75rem">${UNITS[k]||''}</span></td>
      ${selectedPeriods.map(per=>p.stats[per]?`<td>${p.stats[per][k]!==undefined?p.stats[per][k]:'—'}</td>`:'').join('')}
      <td>${evo?`<span class="${evo.cls}">${evo.txt}</span>`:'—'}</td>
    </tr>`;
  });
  
  html += `</tbody></table>`;
  
  // Graphique par indicateur
  cat.keys.forEach(k=>{
    const labels = selectedPeriods.filter(per=>p.stats[per]&&p.stats[per][k]!==undefined);
    if(labels.length < 2) return;
    html += `
      <h3 style="margin-top:20px;color:var(--muted);font-size:.95rem">${LABELS[k]} (${UNITS[k]||''})</h3>
      <div class="chart-wrap" style="height:220px"><canvas id="chart_${k}"></canvas></div>
    `;
  });
  
  html += `</div>`;
  c.innerHTML = html;
  
  // Build charts
  setTimeout(()=>{
    cat.keys.forEach(k=>{
      const canvas = document.getElementById(`chart_${k}`);
      if(!canvas) return;
      const labels = selectedPeriods.filter(per=>p.stats[per]&&p.stats[per][k]!==undefined);
      const data = labels.map(per=>p.stats[per][k]);
      const colors = data.map((v,i)=>{
        if(i===0) return '#58a6ff';
        const better = INVERT.includes(k) ? v < data[i-1] : v > data[i-1];
        return better ? '#2ea043' : '#da3633';
      });
      new Chart(canvas,{
        type:'bar',
        data:{
          labels,
          datasets:[{
            label:LABELS[k],
            data,
            backgroundColor:colors,
            borderRadius:6
          },{
            type:'line',
            label:'Tendance',
            data,
            borderColor:'#f5a623',
            borderWidth:2,
            pointBackgroundColor:'#f5a623',
            tension:0.3,
            fill:false
          }]
        },
        options:{
          responsive:true,maintainAspectRatio:false,
          plugins:{legend:{labels:{color:'#e6edf3'}}},
          scales:{
            x:{ticks:{color:'#8b949e'},grid:{color:'#30363d'}},
            y:{ticks:{color:'#8b949e'},grid:{color:'#30363d'}}
          }
        }
      });
    });
  },50);
}

// ===== INIT =====
initUI();
render();
</script>
