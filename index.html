<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --card2: #1c2128;
    --border: #30363d;
    --accent: #e94560;
    --blue: #0f3460;
    --blue2: #2a5298;
    --gold: #f5a623;
    --ok: #2ea043;
    --ko: #da3633;
    --txt: #e6edf3;
    --muted: #8b949e;
  }
  body {
    background: var(--bg);
    min-height: 100vh;
    padding: 20px;
    color: var(--txt);
  }
  .container { max-width: 1400px; margin: 0 auto; }
  h1 {
    color: var(--txt);
    text-align: center;
    margin-bottom: 30px;
    font-size: 2.2em;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #1a1a2e, var(--blue));
    padding: 25px;
    border-radius: 15px;
    border: 1px solid var(--border);
    border-bottom: 3px solid var(--accent);
  }

  .selectors {
    background: var(--card);
    padding: 25px;
    border-radius: 15px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    margin-bottom: 25px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: center;
    justify-content: center;
  }
  .selectors label {
    font-weight: 600;
    color: var(--gold);
    margin-right: 8px;
    text-transform: uppercase;
    font-size: 0.85em;
    letter-spacing: 1px;
  }
  .selectors select {
    padding: 10px 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1em;
    background: var(--card2);
    color: var(--txt);
    cursor: pointer;
    transition: all 0.2s;
  }
  .selectors select:hover {
    border-color: var(--accent);
    background: var(--bg);
  }

  .dashboard {
    background: var(--card);
    padding: 30px;
    border-radius: 15px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    margin-bottom: 25px;
  }
  .player-header {
    text-align: center;
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--border);
  }
  .player-header h2 {
    color: var(--txt);
    font-size: 2em;
    letter-spacing: 1px;
  }
  .player-header .poste {
    color: var(--gold);
    font-size: 1.1em;
    margin-top: 5px;
    font-style: italic;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
  }
  .stat-card {
    background: var(--card2);
    padding: 18px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    transition: transform 0.2s;
  }
  .stat-card:hover { transform: translateY(-3px); }
  .stat-card .label {
    font-size: 0.8em;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .stat-card .value {
    font-size: 1.8em;
    font-weight: bold;
    color: var(--txt);
    margin: 8px 0;
  }
  .stat-card .evolution {
    font-size: 0.9em;
    font-weight: 600;
  }
  .up { color: var(--ok); }
  .down { color: var(--ko); }
  .neutral { color: var(--muted); }

  .categories {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 25px;
  }
  .cat-btn {
    padding: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--txt);
    border-radius: 10px;
    cursor: pointer;
    font-size: 1em;
    font-weight: 600;
    transition: all 0.3s;
  }
  .cat-btn:hover {
    background: var(--blue);
    border-color: var(--blue2);
    transform: translateY(-2px);
  }
  .cat-btn.active {
    background: linear-gradient(135deg, var(--blue), var(--blue2));
    color: white;
    border-color: var(--accent);
    box-shadow: 0 4px 15px rgba(233,69,96,0.3);
  }

  .category-content {
    background: var(--card);
    padding: 25px;
    border-radius: 15px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .category-content h3 {
    color: var(--txt);
    margin-bottom: 20px;
    font-size: 1.5em;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 10px;
    letter-spacing: 1px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 25px;
    background: var(--card2);
    border-radius: 10px;
    overflow: hidden;
  }
  th {
    background: linear-gradient(135deg, var(--blue), var(--blue2));
    color: white;
    padding: 12px;
    text-align: left;
    text-transform: uppercase;
    font-size: 0.85em;
    letter-spacing: 1px;
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--txt);
  }
  tr:hover td { background: rgba(42, 82, 152, 0.15); }
  tr:last-child td { border-bottom: none; }

  .chart-container {
    position: relative;
    height: 350px;
    margin-top: 20px;
    margin-bottom: 30px;
    background: var(--card2);
    padding: 15px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .sub-title {
    color: var(--gold);
    font-size: 1.15em;
    font-weight: 600;
    margin: 25px 0 12px 0;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    border-left: 4px solid var(--accent);
    padding-left: 12px;
  }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>

const PERIODS = ["Septembre", "Novembre", "Janvier", "Mai"];

const CATEGORIES = {
  anthropo: {
    title: "📏 Anthropométrie",
    fields: [
      { key: "taille", label: "Taille", unit: "cm", betterUp: true },
      { key: "poids", label: "Poids", unit: "kg", betterUp: null }
    ]
  },
  endurance: {
    title: "🏃 Endurance",
    fields: [
      { key: "palier", label: "Yo-Yo Palier", unit: "", betterUp: true },
      { key: "yoyo", label: "Yo-Yo Distance", unit: "m", betterUp: true }
    ]
  },
  force: {
    title: "💪 Force",
    fields: [
      { key: "dc", label: "1RM Développé Couché", unit: "kg", betterUp: true },
      { key: "tirage", label: "1RM Tirage", unit: "kg", betterUp: true },
      { key: "sdt", label: "1RM Soulevé de Terre", unit: "kg", betterUp: true },
      { key: "squat", label: "3RM Squat", unit: "kg", betterUp: true },
      { key: "hipthrust", label: "1RM Hip Thrust", unit: "kg", betterUp: true }
    ]
  },
  vitesse: {
    title: "⚡ Vitesse",
    fields: [
      { key: "v10", label: "10m", unit: "s", betterUp: false },
      { key: "v20", label: "20m", unit: "s", betterUp: false },
      { key: "v25", label: "25m", unit: "s", betterUp: false },
      { key: "v30", label: "30m", unit: "s", betterUp: false },
      { key: "v40", label: "40m", unit: "s", betterUp: false },
      { key: "v50", label: "50m", unit: "s", betterUp: false }
    ]
  },
  puissance: {
    title: "🦘 Puissance",
    fields: [
      { key: "broad", label: "Broad Jump", unit: "cm", betterUp: true }
    ]
  }
};

let currentCategory = "anthropo";
let charts = [];

function getVal(player, period, key) {
  const d = DATA[player]?.[period];
  if (!d) return null;
  const v = d[key];
  return (v === undefined || v === null || v === 0) ? null : v;
}

function fmt(v, unit) {
  if (v === null) return '<span class="empty">—</span>';
  return v + (unit ? " " + unit : "");
}

function evolution(v1, v2, betterUp) {
  if (v1 === null || v2 === null) return { txt: "", cls: "neutral" };
  const diff = v2 - v1;
  if (diff === 0) return { txt: "= 0", cls: "neutral" };
  const sign = diff > 0 ? "+" : "";
  const pct = ((diff / v1) * 100).toFixed(1);
  let cls = "neutral";
  if (betterUp === true)  cls = diff > 0 ? "up" : "down";
  if (betterUp === false) cls = diff < 0 ? "up" : "down";
  return { txt: `${sign}${diff.toFixed(2)} (${sign}${pct}%)`, cls };
}

function initSelectors() {
  const pSel = document.getElementById("playerSelect");
  Object.keys(DATA).sort().forEach(n => {
    const o = document.createElement("option");
    o.value = n; o.textContent = n;
    pSel.appendChild(o);
  });
  const p1 = document.getElementById("period1");
  const p2 = document.getElementById("period2");
  PERIODS.forEach(p => {
    p1.innerHTML += `<option value="${p}">${p}</option>`;
    p2.innerHTML += `<option value="${p}">${p}</option>`;
  });
  p1.value = "Septembre";
  p2.value = "Mai";
  pSel.addEventListener("change", render);
  p1.addEventListener("change", render);
  p2.addEventListener("change", render);
  document.querySelectorAll(".cat-btn").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".cat-btn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      currentCategory = b.dataset.cat;
      renderCategory();
    });
  });
}

function render() {
  const player = document.getElementById("playerSelect").value;
  document.getElementById("playerName").textContent = player;
  document.getElementById("playerPoste").textContent = DATA[player]?.poste || "";
  renderDashboard();
  renderCategory();
}

function renderDashboard() {
  const player = document.getElementById("playerSelect").value;
  const p1 = document.getElementById("period1").value;
  const p2 = document.getElementById("period2").value;
  const grid = document.getElementById("statsGrid");
  grid.innerHTML = "";
  const keyStats = [
    { key: "poids", label: "Poids", unit: "kg", betterUp: null },
    { key: "yoyo", label: "Yo-Yo", unit: "m", betterUp: true },
    { key: "dc", label: "DC", unit: "kg", betterUp: true },
    { key: "squat", label: "Squat", unit: "kg", betterUp: true },
    { key: "v10", label: "10m", unit: "s", betterUp: false },
    { key: "broad", label: "Broad Jump", unit: "cm", betterUp: true }
  ];
  keyStats.forEach(s => {
    const v1 = getVal(player, p1, s.key);
    const v2 = getVal(player, p2, s.key);
    const ev = evolution(v1, v2, s.betterUp);
    grid.innerHTML += `
      <div class="stat-card">
        <div class="label">${s.label}</div>
        <div class="value">${v2 !== null ? v2 + " " + s.unit : "—"}</div>
        <div class="evolution ${ev.cls}">${ev.txt || "—"}</div>
      </div>`;
  });
}

function renderCategory() {
  charts.forEach(c => c.destroy());
  charts = [];
  const player = document.getElementById("playerSelect").value;
  const cat = CATEGORIES[currentCategory];
  const container = document.getElementById("categoryContent");
  let html = `<h3>${cat.title}</h3>`;

  // Regrouper champs par unité pour les graphiques
  const unitGroups = {};
  cat.fields.forEach(f => {
    if (!unitGroups[f.unit]) unitGroups[f.unit] = [];
    unitGroups[f.unit].push(f);
  });

  // Tableau principal
  html += `<table><thead><tr><th>Test</th>`;
  PERIODS.forEach(p => html += `<th>${p}</th>`);
  html += `<th>Évolution (Sept→Mai)</th></tr></thead><tbody>`;
  cat.fields.forEach(f => {
    html += `<tr><td><strong>${f.label}</strong></td>`;
    PERIODS.forEach(p => html += `<td>${fmt(getVal(player, p, f.key), f.unit)}</td>`);
    const ev = evolution(getVal(player, "Septembre", f.key), getVal(player, "Mai", f.key), f.betterUp);
    html += `<td class="${ev.cls}"><strong>${ev.txt || "—"}</strong></td></tr>`;
  });
  html += `</tbody></table>`;

  // Si Vitesse : ajouter tableaux m/s et km/h
  if (currentCategory === "vitesse") {
    html += `<div class="sub-title">📊 Vitesse moyenne (m/s)</div>`;
    html += `<table><thead><tr><th>Distance</th>`;
    PERIODS.forEach(p => html += `<th>${p}</th>`);
    html += `</tr></thead><tbody>`;
    cat.fields.forEach(f => {
      const dist = parseInt(f.key.replace("v",""));
      html += `<tr><td><strong>${f.label}</strong></td>`;
      PERIODS.forEach(p => {
        const t = getVal(player, p, f.key);
        html += `<td>${t ? (dist/t).toFixed(2) + " m/s" : '<span class="empty">—</span>'}</td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table>`;

    html += `<div class="sub-title">📊 Vitesse moyenne (km/h)</div>`;
    html += `<table><thead><tr><th>Distance</th>`;
    PERIODS.forEach(p => html += `<th>${p}</th>`);
    html += `</tr></thead><tbody>`;
    cat.fields.forEach(f => {
      const dist = parseInt(f.key.replace("v",""));
      html += `<tr><td><strong>${f.label}</strong></td>`;
      PERIODS.forEach(p => {
        const t = getVal(player, p, f.key);
        html += `<td>${t ? ((dist/t)*3.6).toFixed(2) + " km/h" : '<span class="empty">—</span>'}</td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table>`;
  }

  // Graphiques : un par groupe d'unité
  Object.keys(unitGroups).forEach((unit, idx) => {
    html += `<div class="sub-title">📈 Évolution ${unit ? "(" + unit + ")" : ""}</div>`;
    html += `<div class="chart-container"><canvas id="chart_${idx}"></canvas></div>`;
  });

  container.innerHTML = html;

  // Création des charts
  Object.keys(unitGroups).forEach((unit, idx) => {
    const ctx = document.getElementById(`chart_${idx}`);
    const datasets = unitGroups[unit].map((f, i) => {
      const colors = ["#2a5298","#e74c3c","#27ae60","#f39c12","#8e44ad","#16a085"];
      return {
        label: f.label,
        data: PERIODS.map(p => getVal(player, p, f.key)),
        borderColor: colors[i % colors.length],
        backgroundColor: colors[i % colors.length] + "33",
        borderWidth: 3, tension: 0.3, spanGaps: true
      };
    });
    const chart = new Chart(ctx, {
      type: "line",
      data: { labels: PERIODS, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: "top" } },
        scales: { y: { beginAtZero: false } }
      }
    });
    charts.push(chart);
  });
}

initSelectors();
render();
</script>
